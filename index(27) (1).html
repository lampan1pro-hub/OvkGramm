<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAIMONGRAM</title>
<meta name="theme-color" content="#17212b">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<script>
(function(){var t;try{t=localStorage.getItem('theme_v2')}catch(e){}
if(t!=='dark'&&t!=='light')t='dark';
document.documentElement.dataset.theme=t;
var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#17212b':'#ffffff'})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#0084ff;--pd:#0066cc;--pl:#e7f3ff;--bg:#f0f2f5;--t:#111;--t2:#65676b;--b:#e5e5ea;--on:#31a24c}
html,body{height:100%}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--t);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ib,#send{transition:background .15s,transform .1s}
.ib:active,#send:active{transform:scale(.92)}
button:disabled{opacity:.5;cursor:default}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;color:var(--t2);margin-bottom:4px}
.f input,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:16px;font-size:16px}
.f input:focus,.f textarea:focus{outline:0;border-color:var(--p);background:var(--pl)}
.btn{width:100%;padding:11px;border-radius:12px;font-weight:600;background:var(--p);color:#fff;transition:background .15s,transform .1s}
.btn:hover:not(:disabled){background:var(--pd)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.g{background:var(--bg);color:var(--p)}
.btn.r{background:#fdecea;color:#d33}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{flex:1}
.err{color:#d33;font-size:13px;min-height:18px;margin:4px 0}
.lnk{color:var(--p);font-weight:600;padding:6px 10px}
/* вход */
#auth{height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;background:linear-gradient(135deg,#0084ff,#0066cc);padding-bottom:80px}
.card{background:#fff;border-radius:24px;padding:28px 28px 40px;width:100%;max-width:400px;max-height:calc(100dvh - 80px);overflow-y:auto;overflow-x:hidden}
.logo{font-size:30px;font-weight:800;color:var(--p);text-align:center}
.tag{text-align:center;color:var(--t2);font-size:14px;margin-bottom:20px}
.tg{text-align:center;margin-top:14px;font-size:14px;color:var(--t2)}
.tg button{color:var(--p);font-weight:600}
/* каркас */
#app{display:flex;height:100dvh;background:#fff;position:relative;overflow:hidden}
#side{width:360px;border-right:1px solid var(--b);display:flex;flex-direction:column;flex-shrink:0}
.sh{display:flex;align-items:center;gap:10px;padding:10px 14px}
.sh h1{flex:1;min-width:0;font-size:22px;font-weight:800;color:var(--p);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;background:var(--bg);font-size:20px;display:grid;place-items:center;flex-shrink:0}
.ib:hover{background:#e4e6ea}
#meBtn{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:24px;background:var(--bg);font-weight:600;font-size:14px;flex-shrink:0}
#meBtn:hover{background:#e4e6ea}
#conn{background:#fff3cd;color:#856404;font-size:12px;text-align:center;padding:4px}
#q{margin:0 14px 8px;padding:10px 16px;border:1px solid transparent;background:var(--bg);border-radius:22px;font-size:16px}
#q:focus{outline:0;background:#fff;border-color:var(--p)}
#list{flex:1;overflow-y:auto}
.it{display:flex;gap:12px;padding:10px 14px;cursor:pointer;align-items:center;transition:background .15s;content-visibility:auto;contain-intrinsic-size:auto 68px}
.it:hover{background:var(--bg)}
.it.on{background:var(--pl)}
.sec{padding:10px 14px 4px;font-size:13px;color:var(--t2);font-weight:600}
.av{position:relative;width:48px;height:48px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:#fff;font-weight:600;font-size:18px}
.av.s{width:40px;height:40px;font-size:16px}
.av.xs{width:32px;height:32px;font-size:14px}
.av.l{width:96px;height:96px;font-size:38px;margin:0 auto}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av i{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--on);border:2px solid #fff}
.im{flex:1;min-width:0}
.r1,.lm{display:flex;justify-content:space-between;gap:8px}
.nm{display:flex;align-items:center;gap:4px;min-width:0;font-weight:600}
.nm .nt{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.vb{width:1.05em;height:1.05em;flex-shrink:0;vertical-align:-.18em}
.tm{font-size:12px;color:var(--t2);flex-shrink:0}
.lm{color:var(--t2);font-size:14px}
.lm span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bd{background:var(--p);color:#fff;border-radius:10px;min-width:20px;padding:0 6px;font-size:12px;line-height:20px;text-align:center}
.tk{font-size:12px;letter-spacing:-2px}
.tm .tk{margin-right:5px}
.tm .tk.rd{color:var(--p)}
/* чат */
#chat{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
#empty{margin:auto;text-align:center;color:var(--t2);padding:20px}
#room{flex:1;min-height:0;display:flex;flex-direction:column}
.rh{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--b)}
#back{display:none}
#hd{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
#hd small{display:block;color:var(--t2);font-size:13px}
#hd small.ty{color:var(--p)}
#msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.day{align-self:center;font-size:12px;color:var(--t2);background:#fff;padding:2px 10px;border-radius:10px;margin:8px 0}
.m{max-width:min(70%,520px);padding:7px 11px;border-radius:18px 18px 18px 4px;background:#fff;overflow-wrap:anywhere;white-space:pre-wrap;align-self:flex-start}
.m.new{animation:msgIn .22s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.m.me{align-self:flex-end;background:var(--p);color:#fff;border-radius:18px 18px 4px 18px}
.m b{display:block;font-size:12px;color:var(--p)}
.m time{font-size:11px;color:var(--t2);margin-left:8px;float:right;margin-top:6px}
.m.me time{color:rgba(255,255,255,.75)}
.m .tk{margin-left:5px}
.m.me .tk.rd{color:#b6f0ff}
.m video,.m img.ph{display:block;width:340px;max-width:100%;max-height:420px;border-radius:15px;object-fit:cover;background:#000;cursor:pointer}
.m video{object-fit:contain;cursor:default}
.m.mm{padding:3px;border-radius:18px}
.m.mm b{padding:3px 8px 0}
.m.mm .tx{display:block;padding:5px 8px 0}
.m.mm time{display:block;float:none;text-align:right;padding:2px 8px 2px;margin:0}
#pend{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-top:1px solid var(--b)}
#pend .th{width:48px;height:48px;border-radius:12px;object-fit:cover;background:#000;flex-shrink:0}
#pend .st{flex:1;font-size:14px;color:var(--t2)}
#form{display:flex;gap:6px;align-items:flex-end;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--b)}
#attach,#attachMulti{transition:transform .15s,background .15s}
#attach:hover,#attachMulti:hover{transform:scale(1.1)}
#attach:active,#attachMulti:active{transform:scale(.95)}
#pend:not([hidden])+#form{border-top:0}
#inp{flex:1;resize:none;max-height:120px;padding:9px 14px;border:1px solid var(--b);border-radius:24px;font-size:16px;line-height:1.3;display:block;transition:border-color .15s,background .15s}
#inp:focus{border-color:var(--p);background:var(--pl)}
#inp:focus{outline:0;border-color:var(--p)}
#send{width:40px;height:40px;border-radius:50%;background:var(--p);color:#fff;font-size:16px;flex-shrink:0}
/* окна */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;animation:fadeIn .18s ease;backdrop-filter:blur(3px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal .card{animation:slideUp .22s ease-out;border-radius:24px}
@keyframes slideUp{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal h2{font-size:20px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#wallet{display:flex;justify-content:space-between;align-items:center;width:calc(100% - 28px);margin:0 14px 8px;padding:9px 14px;border-radius:12px;background:linear-gradient(90deg,#fff1e6,#ffe0f0);font-weight:600;font-size:14px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.gc{border-radius:18px;padding:10px 6px 8px;text-align:center;color:#fff;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.25);user-select:none;transition:transform .2s,box-shadow .2s}
.gc:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.15)}
.gc.off{opacity:.45;cursor:default}
.gc .gi{font-size:34px;line-height:1.15}
.gc .gn{font-size:12px;font-weight:600;margin-top:2px}
.gc .gs{font-size:11px;opacity:.92}
.gc.big{padding:22px 10px;max-width:200px;margin:0 auto;cursor:default}
.gc.big .gi{font-size:72px}
.gc.big .gn{font-size:16px}
.gb{border-radius:16px;padding:14px 20px;min-width:190px;text-align:center;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);white-space:normal}
.gb .gi{font-size:56px;line-height:1.2}
.gb .gt{font-size:12px;opacity:.95}
.gb .gn{font-weight:700}
.m.ch{max-width:min(85%,560px)}
.bb{display:flex;flex-direction:column;gap:5px;margin-top:8px;clear:both}.bb .br{display:flex;gap:5px}.bbtn{flex:1;padding:9px 10px;border-radius:10px;background:var(--pl);color:var(--p);font-weight:600;font-size:14px;text-align:center;white-space:normal}.bbtn:hover{background:#d3e9ff}.bbtn:active{transform:scale(.98)}
#rdonly .btn{max-width:420px}
#rdonly{padding:12px 12px calc(12px + env(safe-area-inset-bottom));text-align:center;color:var(--t2);background:#fff;border-top:1px solid var(--b);font-size:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:30;font-size:14px;max-width:90%;text-align:center}
#editbar{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#fff8e1;border-top:1px solid var(--b);font-size:14px}
#editbar span{flex:1}
.mb{opacity:.55;padding:0 4px;margin-right:2px;font-size:15px;line-height:1}
.mb:hover{opacity:1}
.m.pending{opacity:.7}
.m.pending .tk{letter-spacing:0}
.gc.r-rare{box-shadow:0 0 0 2px #6ab7ff inset}
.gc.r-epic{box-shadow:0 0 0 2px #c58bff inset}
.gc.r-legendary{box-shadow:0 0 0 2px #ffd54a inset,0 0 12px rgba(255,213,74,.55)}
#hd small.ty:empty{display:none}
@media(max-width:400px){.sh h1{font-size:19px}}
@media(max-width:340px){#meBtn span{display:none}#meBtn{padding:4px}}
@media(max-width:768px){
#side{width:100%}
#chat{position:absolute;inset:0;transform:translateX(100%);transition:transform .2s;z-index:5}
#app.open #chat{transform:none}
#back{display:grid}
.m{max-width:85%}
}
/* ===== Оформление в стиле Telegram ===== */
:root{--p:#3390ec;--pd:#2b7fd1;--pl:#e8f2fd;--bg:#f4f4f5;--t:#000;--t2:#707579;--b:#e7e7e9;--on:#4dcd5e;--out:#effdde;--outt:#5ca75a}
body{font-family:Roboto,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:15px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:3px}
#auth{background:linear-gradient(160deg,#6bbdf8,#3390ec)}
.card{border-radius:16px}.logo{font-size:26px;letter-spacing:.5px}
.btn{border-radius:10px;text-transform:none;letter-spacing:.2px}
.f input,.f textarea{border-radius:10px}
/* список чатов */
#side{width:400px;border-right:1px solid var(--b)}
.sh{padding:8px 12px 6px}
.sh h1{font-size:19px;font-weight:600;color:var(--t)}
.ib{background:transparent;color:var(--t2)}
.ib:hover{background:rgba(112,117,121,.12)}
#meBtn{background:transparent}
#meBtn:hover{background:rgba(112,117,121,.12)}
#q{background:var(--bg);border:2px solid transparent;border-radius:22px;padding:9px 16px}
#q:focus{background:#fff;border-color:var(--p)}
#wallet{background:var(--pl);color:var(--pd);border-radius:10px}
.it{padding:9px 10px;margin:0 6px;border-radius:10px;gap:11px}
.it:hover{background:var(--bg)}
.it.on{background:var(--p);color:#fff}
.it.on .lm,.it.on .tm{color:rgba(255,255,255,.85)}
.it.on .tm .tk,.it.on .tm .tk.rd{color:#fff}
.it.on .bd{background:#fff;color:var(--p)}
.it.on .av i{border-color:var(--p)}
.r1 .nm{font-weight:500;font-size:16px}
.bd{background:#c4c9cc;min-width:22px;line-height:22px;border-radius:11px;font-weight:500}
.sec{color:var(--p);font-weight:500;padding:12px 16px 4px}
.lm{font-size:15px}
/* чат */
#chat{background:#8fbf8c;background-image:radial-gradient(circle at 20% 15%,rgba(255,255,255,.28) 0,transparent 42%),radial-gradient(circle at 85% 80%,rgba(255,255,255,.2) 0,transparent 45%),linear-gradient(165deg,#d4e6b5 0%,#a9d4a0 40%,#7fbfa6 100%)}
#empty{align-self:center}
#empty h2,#empty p{display:inline-block;background:rgba(0,0,0,.28);color:#fff;border-radius:14px;padding:3px 12px;margin:3px 0;font-size:14px;font-weight:500}
#empty div{display:none}
.rh{padding:6px 12px;border-bottom:0;box-shadow:0 1px 2px rgba(16,35,47,.12);z-index:2}
#hd .nm{font-size:16px;font-weight:500}
#msgs{padding:10px 14px;gap:2px}
.day{background:rgba(0,0,0,.28);color:#fff;font-weight:500;padding:3px 12px;border-radius:14px}
.m{border-radius:12px 12px 12px 4px;padding:6px 10px 6px;background:#fff;color:#000;box-shadow:0 1px 1px rgba(16,35,47,.16)}
.m.me{background:var(--out);color:#000;border-radius:12px 12px 4px 12px}
.m.ch{border-radius:12px}
.m time{color:#9aa3a8;font-size:12px}
.m.me time{color:var(--outt)}
.m.me .tk{color:var(--outt)}
.m.me .tk.rd{color:#4fae4e}
.m b{color:var(--p);font-weight:500}
.m.mm{padding:3px;border-radius:12px}
#pend,#form{background:#fff;border-top:0}
#form{padding:8px 10px calc(8px + env(safe-area-inset-bottom));align-items:flex-end}
#inp{border:0;background:#fff;border-radius:0;padding:9px 8px}
#inp:focus{border:0}
#send{background:transparent;color:var(--p);font-size:22px;width:44px}
#send:hover{background:rgba(51,144,236,.1)}
#rdonly{background:#fff;border-top:0;color:var(--p);font-weight:500;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
#rdonly .btn{background:transparent;color:var(--p);text-transform:uppercase;letter-spacing:.5px;max-width:none;font-weight:500}
#rdonly .btn:hover:not(:disabled){background:rgba(51,144,236,.1)}
#editbar{background:#fff}
/* кнопки бота — как inline-клавиатура Telegram */
.bb{margin:8px -4px -2px}
.bbtn{background:rgba(51,144,236,.12);color:var(--pd);border-radius:8px;font-weight:500}
.bbtn:hover{background:rgba(51,144,236,.2)}
/* окна */
.modal{background:rgba(0,0,0,.4)}
.modal .card{border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.25)}
/* подарки / NFT */
.gc .gp,.gb .gt:last-child{}
.gc .gp{display:inline-block;margin-top:3px;font-size:10px;font-weight:700;background:rgba(0,0,0,.28);border-radius:8px;padding:0 6px;line-height:16px}
.gb{border-radius:12px}
.bdl{text-align:center;margin-top:8px;font-size:13px;font-weight:600;color:var(--t)}
.bdw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.bdc{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--bg);border-radius:10px;padding:2px 8px 2px 3px}
.bdc i{width:14px;height:14px;border-radius:50%;display:inline-block}
@media(max-width:768px){#side{width:100%}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Плавный «заглаженный» дизайн в стиле Telegram ===== */
button,input,textarea{transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
.it,.bbtn,.btn,.gc,.gb,.card{transition:border-radius .2s,background .15s,transform .15s,box-shadow .2s}

/* Шапка чата — без резкой границы, мягкая тень и мягкое нижнее скругление */
.rh{border-bottom:0;box-shadow:0 1px 10px rgba(16,35,47,.10);border-radius:0 0 20px 20px}

/* Поле ввода — капсула на сером фоне, как в ТГ */
#form{gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#inp{background:var(--bg);border:1px solid transparent;border-radius:24px;padding:10px 16px}
#inp:focus{background:#fff;border-color:var(--p);box-shadow:0 0 0 3px rgba(51,144,236,.12)}

/* Кнопка отправки и круглые иконки */
#send,.ib{border-radius:50%}
#send:hover{background:rgba(51,144,236,.12)}

/* Пузыри сообщений — более мягкие, с одним «хвостом» */
.m{border-radius:18px 18px 18px 6px}
.m.me{border-radius:18px 18px 6px 18px}
.m.mm{border-radius:16px}
.m.ch{border-radius:16px}
.m video,.m img.ph{border-radius:14px}

/* Кнопки — мягко закруглённые */
.btn{border-radius:14px}
.bbtn{border-radius:12px}
.gc{border-radius:22px}
.gb{border-radius:18px}
.lnk{border-radius:12px;padding:6px 12px}
.lnk:hover{background:rgba(51,144,236,.10)}

/* Поля в формах и поиск — округлее */
.f input,.f textarea,#q{border-radius:14px}

/* Окна и карточки */
.card,.modal .card{border-radius:24px}
.modal{background:rgba(0,0,0,.45);backdrop-filter:blur(6px)}

/* Список чатов */
.it{border-radius:16px}

/* Мелочи: бейдж, разделитель дат, кошелёк, тост, превью вложения */
.bd{border-radius:12px}
.day{border-radius:14px}
#wallet{border-radius:16px}
#toast{border-radius:22px}
#pend .th{border-radius:16px}
#conn{border-radius:12px;margin:0 10px 6px}
.mb{border-radius:50%;padding:2px 8px}
.mb:hover{background:rgba(112,117,121,.12)}

/* Блок «только автор канала может писать» и панель редактирования — мягче */
#rdonly{border-radius:0}
#editbar{border-radius:0}

/* Авторизация — карточка и кнопки ещё мягче */
#auth .card{border-radius:28px}
#auth .btn{border-radius:16px}


/* ===== Реакции, просмотры, окно подарка ===== */
.rx{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;clear:both}
.m.mm .rx{padding:0 6px 2px}
.rxc{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:14px;background:rgba(51,144,236,.12);color:var(--pd);font-size:13px;font-weight:600;line-height:20px}
.rxc.on{background:var(--p);color:#fff}
.m.me .rxc{background:rgba(76,175,80,.16);color:#3d8b40}
.m.me .rxc.on{background:#4fae4e;color:#fff}
#rbar{position:fixed;z-index:60;display:flex;gap:2px;padding:6px 8px;background:#fff;border-radius:28px;box-shadow:0 6px 28px rgba(0,0,0,.22);animation:popIn .18s ease-out}
#rbar button{font-size:24px;line-height:1;padding:6px;border-radius:50%;background:transparent}
#rbar button:hover{background:var(--bg);transform:scale(1.18)}
.vw{margin-right:6px}
.gb{cursor:pointer}
.gb .gq{margin-top:8px;padding:7px 12px;border-radius:14px;background:rgba(255,255,255,.24);font-size:14px;white-space:pre-wrap}
.gc .gnote{position:absolute;top:6px;right:8px;font-size:13px}
.gc{position:relative}
.gh2{font-size:24px;font-weight:700;text-align:center;margin-top:14px}
.gtab{border:1px solid var(--b);border-radius:18px;overflow:hidden;margin-top:14px;text-align:left}
.gtab .gr{display:flex;border-top:1px solid var(--b)}
.gtab .gr:first-child{border-top:0}
.gtab .gk{flex:0 0 34%;padding:13px 14px;background:var(--bg);font-weight:700;font-size:15px;border-right:1px solid var(--b)}
.gtab .gv{flex:1;padding:13px 14px;font-size:15px;overflow-wrap:anywhere}
.gtab .gnv{font-size:16px}
.gok{border-radius:999px}
.gc.big.pop{animation:popIn .45s ease-out}
#form{margin:6px 10px calc(6px + env(safe-area-inset-bottom));padding:6px 8px;border-radius:26px;box-shadow:0 2px 12px rgba(16,35,47,.10)}
#pend{margin:6px 10px 0;border-radius:18px}


/* ===== Комментарии, аксессуар у ника, чекбокс текстового канала ===== */
.cm{display:flex;align-items:center;gap:10px;clear:both;margin:8px -4px -2px;padding:8px 4px 2px;border-top:1px solid rgba(112,117,121,.22);color:var(--p);font-weight:600;cursor:pointer;user-select:none}
.cm:hover .cmt{text-decoration:underline}
.cmav{display:inline-flex}
.cmav+.cmav{margin-left:-12px}
.cmav .av{width:30px;height:30px;font-size:13px;border:2px solid var(--cmb,#fff)}
.cmt{flex:1;min-width:0;font-size:15px}
.cmc{font-size:24px;line-height:1;font-weight:400}
.cml{max-height:46vh;overflow-y:auto;margin:0 -6px 10px;padding:0 6px;display:flex;flex-direction:column;gap:12px}
.cmi{display:flex;gap:10px;align-items:flex-start}
.cmb{flex:1;min-width:0;background:var(--bg);border-radius:16px 16px 16px 6px;padding:7px 12px}
.cmn{display:flex;align-items:baseline;gap:8px;font-size:13px}
.cmn .nm{font-size:13px;font-weight:600;color:var(--p)}
.cmn time{margin-left:auto;font-size:11px;color:var(--t2);white-space:nowrap}
.cmx{margin-top:2px;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.cmd{opacity:.5;font-size:15px;padding:4px;border-radius:50%}
.cmd:hover{opacity:1;background:rgba(112,117,121,.15)}
.cmf{display:flex;gap:8px;align-items:center}
.cmf input{flex:1;min-width:0;padding:11px 16px;border:1px solid var(--b);border-radius:24px;font-size:16px;background:var(--bg)}
.cmf input:focus{outline:0;border-color:var(--p)}
.cms{width:44px;height:44px;border-radius:50%;background:var(--p);color:#fff;font-size:18px;flex-shrink:0}
.acc{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;margin-left:4px;font-size:12px;line-height:1;flex-shrink:0;vertical-align:middle;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
h2 .acc,.cmn .acc{margin-left:6px}
a.hndl{color:var(--p);font-weight:600;cursor:pointer;text-decoration:none}
a.hndl:hover{text-decoration:underline}
.m.me a.hndl{color:inherit;text-decoration:underline}
h2 .acc{width:26px;height:26px;font-size:16px}
#acctip{position:fixed;z-index:80;padding:7px 14px;border-radius:18px;background:rgba(60,60,64,.92);color:#fff;font-size:14px;font-weight:600;pointer-events:none;animation:popIn .15s ease-out;white-space:nowrap}
.gc .gworn{position:absolute;top:6px;left:8px;font-size:13px}
.chk{display:flex;gap:12px;align-items:flex-start;margin:4px 0 12px;padding:10px 12px;border-radius:16px;background:var(--bg);cursor:pointer}
.chk input{margin-top:3px;width:18px;height:18px;accent-color:var(--p);flex-shrink:0}
.chk b{display:block;font-size:15px}
.chk small{display:block;color:var(--t2);font-size:12px;line-height:1.35;margin-top:2px}
#themeBtn{font-size:18px}

/* ===== Тёмная тема (палитра Telegram Night) ===== */
html[data-theme=dark]{color-scheme:dark;--p:#6ab2f2;--pd:#8ec4f6;--pl:#22405c;--bg:#0e1621;--t:#f5f5f5;--t2:#8b9bab;--b:#263648;--cmb:#182533}
html[data-theme=dark] body{background:#0e1621}
html[data-theme=dark] #app,html[data-theme=dark] .card,html[data-theme=dark] .rh,html[data-theme=dark] #pend,html[data-theme=dark] #form,html[data-theme=dark] #rdonly,html[data-theme=dark] #editbar,html[data-theme=dark] #rbar{background:#17212b}
html[data-theme=dark] #side{background:#17212b;border-right-color:#0a121b}
html[data-theme=dark] .modal{background:rgba(0,0,0,.62)}
html[data-theme=dark] .modal .card{box-shadow:0 8px 40px rgba(0,0,0,.6)}
html[data-theme=dark] #auth{background:linear-gradient(160deg,#1c2b3b,#0e1621)}
html[data-theme=dark] .ib:hover,html[data-theme=dark] #meBtn:hover{background:rgba(255,255,255,.08)}
html[data-theme=dark] #q,html[data-theme=dark] .f input,html[data-theme=dark] .f textarea,html[data-theme=dark] #inp,html[data-theme=dark] .cmf input{background:#242f3d;color:var(--t)}
html[data-theme=dark] #q:focus,html[data-theme=dark] #inp:focus{background:#1d2834}
html[data-theme=dark] .f input:focus,html[data-theme=dark] .f textarea:focus{background:#1d2834}
html[data-theme=dark] #q::placeholder,html[data-theme=dark] #inp::placeholder,html[data-theme=dark] .f input::placeholder,html[data-theme=dark] .cmf input::placeholder{color:#6b7b8c}
html[data-theme=dark] .it:hover{background:#202b36}
html[data-theme=dark] .it.on{background:#2b5278;color:#fff}
html[data-theme=dark] .it.on .bd{background:#fff;color:#2b5278}
html[data-theme=dark] .it.on .av i{border-color:#2b5278}
html[data-theme=dark] .av i{border-color:#17212b}
html[data-theme=dark] .bd{background:#4a5a6a}
html[data-theme=dark] #wallet{background:linear-gradient(90deg,#2b2540,#3a2438);color:#f3e6ff}
html[data-theme=dark] .btn{background:#3390ec;color:#fff}
html[data-theme=dark] .btn:hover:not(:disabled){background:#2b7fd1}
html[data-theme=dark] .btn.g{background:#242f3d;color:var(--p)}
html[data-theme=dark] .btn.r{background:#3a2024;color:#ff7b7b}
html[data-theme=dark] .err{color:#ff7b7b}
html[data-theme=dark] .lnk:hover{background:rgba(106,178,242,.14)}
html[data-theme=dark] #conn{background:#4a3f1a;color:#ffd866}
html[data-theme=dark] #chat{background:#0e1621;background-image:radial-gradient(circle at 20% 15%,rgba(80,120,170,.20) 0,transparent 42%),radial-gradient(circle at 85% 80%,rgba(60,90,140,.18) 0,transparent 45%),linear-gradient(165deg,#13202e 0%,#0f1b28 45%,#0b1520 100%)}
html[data-theme=dark] .rh{box-shadow:0 1px 10px rgba(0,0,0,.45)}
html[data-theme=dark] #form,html[data-theme=dark] #rdonly{box-shadow:0 2px 12px rgba(0,0,0,.4)}
html[data-theme=dark] #rdonly .btn,html[data-theme=dark] #rdonly .btn:hover:not(:disabled){background:transparent;color:var(--p)}
html[data-theme=dark] #send{color:var(--p)}
html[data-theme=dark] .day,html[data-theme=dark] #empty h2,html[data-theme=dark] #empty p{background:rgba(0,0,0,.4);color:#dfe6ee}
html[data-theme=dark] .m{background:#182533;color:#f5f5f5;box-shadow:0 1px 1px rgba(0,0,0,.35)}
html[data-theme=dark] .m.me{background:#2b5278;color:#fff}
html[data-theme=dark] .m time{color:#7f91a4}
html[data-theme=dark] .m.me time{color:#a9c6e2}
html[data-theme=dark] .m.me .tk{color:#8fb8de}
html[data-theme=dark] .m.me .tk.rd{color:#7fd1ff}
html[data-theme=dark] .m b{color:var(--p)}
html[data-theme=dark] .m.me b{color:#9fd0ff}
html[data-theme=dark] .bbtn{background:rgba(106,178,242,.16);color:#8ec4f6}
html[data-theme=dark] .bbtn:hover{background:rgba(106,178,242,.26)}
html[data-theme=dark] .rxc{background:rgba(106,178,242,.18);color:#8ec4f6}
html[data-theme=dark] .rxc.on{background:#3390ec;color:#fff}
html[data-theme=dark] .m.me .rxc{background:rgba(255,255,255,.14);color:#d6e9fb}
html[data-theme=dark] .m.me .rxc.on{background:#3390ec;color:#fff}
html[data-theme=dark] #rbar{box-shadow:0 6px 28px rgba(0,0,0,.6)}
html[data-theme=dark] #rbar button:hover{background:#242f3d}
html[data-theme=dark] .gtab .gk{background:#1c2733}
html[data-theme=dark] .bdc{background:#242f3d}
html[data-theme=dark] .chk{background:#242f3d}
html[data-theme=dark] .cmb{background:#242f3d}
html[data-theme=dark] .cm{border-top-color:rgba(255,255,255,.12)}
html[data-theme=dark] .m.me .cm{color:#9fd0ff}
html[data-theme=dark] #acctip{background:rgba(120,130,140,.92)}
html[data-theme=dark] ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18)}
html[data-theme=dark] #toast{background:#2b3a4a}
html[data-theme=dark] .gc{box-shadow:none}
html[data-theme=dark] .gc.r-rare{box-shadow:0 0 0 2px #4a90d9 inset}
html[data-theme=dark] .gc.r-epic{box-shadow:0 0 0 2px #a46de0 inset}
html[data-theme=dark] .gc.r-legendary{box-shadow:0 0 0 2px #e6b830 inset,0 0 12px rgba(230,184,48,.45)}
html[data-theme=dark] hr{border-color:#263648}


/* ===== Код из письма, рынок NFT ===== */
.cr{display:flex;gap:8px;align-items:stretch}
.cr input{flex:1;min-width:0;letter-spacing:3px;font-size:18px;text-align:center}
.cr .btn{width:auto;flex-shrink:0;padding:0 14px;font-size:13px;line-height:1.2}
.mkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
/* Рынок юзернеймов */
.un-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--b);border-radius:18px;margin-bottom:10px;cursor:pointer;transition:background .15s}
.un-card:hover{background:var(--bg2,#f4f6f8)}
.un-av{flex-shrink:0}
.un-body{flex:1;min-width:0}
.un-handle{font-size:17px;font-weight:700;color:var(--t)}
.un-also{font-size:13px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un-also a{color:var(--p)}
.un-price{flex-shrink:0;font-size:14px;font-weight:600;color:var(--p);white-space:nowrap}
.un-qr{flex-shrink:0;width:36px;height:36px;opacity:.5}
.un-my-badge{display:inline-block;font-size:11px;background:var(--p);color:#fff;border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.chip{padding:7px 14px;border-radius:999px;background:var(--bg);color:var(--t);font-weight:600;font-size:13px}
.chip.on{background:var(--p);color:#fff}
.mkbar select{margin-left:auto;max-width:48%;padding:7px 10px;border-radius:999px;border:1px solid var(--b);background:var(--bg);color:var(--t);font-size:13px}
.gc .glot{position:absolute;bottom:6px;right:8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.35);color:#fff;border-radius:8px;padding:0 6px;line-height:16px}
html[data-theme=dark] .chip{background:#242f3d}
html[data-theme=dark] .chip.on{background:#3390ec;color:#fff}
html[data-theme=dark] .mkbar select{background:#242f3d;border-color:#263648}
html[data-theme=dark] .un-card{border-color:#263648}
html[data-theme=dark] .un-card:hover{background:#1c2733}
html[data-theme=dark] .un-handle{color:#e8f0fb}

/* Тонкий круглый скроллбар */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ===== Доокругление нижних панелей (СТАРТ / «только автор» / заблокирован) и ввода ===== */
#rdonly{border-top:0;margin:6px 10px calc(6px + env(safe-area-inset-bottom));border-radius:22px;box-shadow:0 2px 12px rgba(16,35,47,.10)}
#rdonly .btn{border-radius:16px}

/* Панель ввода — мягкие верхние углы */
#form{border-radius:24px 24px 0 0}
#pend{border-radius:24px 24px 0 0;border-top:0;box-shadow:0 -2px 12px rgba(16,35,47,.06)}
#editbar{border-radius:18px 18px 0 0}

/* Шапка чата — увеличиваем радиус и убираем остатки резких углов */
.rh{border-radius:0 0 22px 22px}

/* На телефоне панели чуть отступают от краёв — выглядит как «плашки» в ТГ */
@media(max-width:768px){
  #rdonly{margin:6px 8px calc(6px + env(safe-area-inset-bottom))}
}

/* ===== Шапка: название слева, кнопки прижаты вправо ===== */
.sh h1{flex:1 1 auto;min-width:0}              /* название забирает всё свободное место и толкает кнопки к правому краю */
.sh .ib,.sh #meBtn{flex-shrink:0}              /* кнопки и профиль — никогда не сжимаются */
.sh{gap:4px}
#pushBtn{margin-left:auto}                     /* страховка: первую кнопку всегда прижимает вправо */
@media(max-width:768px){
  .sh{padding:8px 8px 6px}
  .sh h1{font-size:17px}                       /* без max-width — иначе flex:1 не срабатывает */
  #meBtn span{display:none}                    /* на телефоне — только аватарка, как в ТГ */
  #meBtn{padding:2px}
  #meBtn .av{width:34px;height:34px}
  .sh .ib{width:36px;height:36px;font-size:18px}
}
@media(max-width:400px){
  .sh h1{font-size:15px}
}

/* ===== Голосовые сообщения ===== */
.vc{display:flex;align-items:center;gap:9px;min-width:210px;padding:2px 0}
.vcb{width:36px;height:36px;border-radius:50%;background:var(--p);color:#fff;font-size:15px;flex-shrink:0;display:grid;place-items:center}
.vcb:hover{filter:brightness(1.08)}
.vc.playing .vcb{background:#e53935}
.vcb2{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.vctr{flex:1;height:22px;display:flex;align-items:center}
.vcbar{position:relative;flex:1;height:3px;background:rgba(112,117,121,.3);border-radius:2px;overflow:hidden}
.vcbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--p);border-radius:2px;transition:width .15s linear}
.vc.playing .vcbar i{background:#e53935}
.vct{font-size:12px;color:var(--t2);min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
.m.me .vct{color:var(--outt)}
/* панель записи */
#recbar{display:flex;align-items:center;gap:10px;margin:6px 10px 0;padding:8px 14px;border-radius:18px;background:#fff;box-shadow:0 2px 12px rgba(16,35,47,.10)}
#recbar .rt{color:#e53935;font-variant-numeric:tabular-nums;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.55}}
#recbar span{flex:1;color:var(--t2);font-size:13px}
html[data-theme=dark] #recbar{background:#242f3d}
/* панель эмодзи */
#room{position:relative}
#emobar{position:absolute;bottom:76px;left:10px;right:10px;z-index:8;background:#fff;border-radius:18px;box-shadow:0 6px 28px rgba(0,0,0,.22);padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:190px;overflow-y:auto}
#emobar button{font-size:22px;padding:6px;border-radius:10px;line-height:1.2}
#emobar button:hover{background:var(--bg)}
#emobar button:active{transform:scale(1.15)}
html[data-theme=dark] #emobar{background:#242f3d}
html[data-theme=dark] #emobar button:hover{background:#1c2733}
#emojiBtn{font-size:20px}

.av.ghost{display:flex;align-items:center;justify-content:center;position:relative}
.av.ghost svg{width:72%;height:72%;display:block}
.frozen-note{color:var(--t2);margin-top:12px;font-size:14px}
.adm-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--b)}
.adm-sub{color:var(--t2);font-size:12px;margin-top:2px}
.adm-btn{width:auto;padding:6px 12px;font-size:13px;flex-shrink:0}

/* ===== Ответы, пересылка, закрепы, поиск по чату ===== */
#replybar{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#fff;border-top:1px solid var(--b);font-size:14px}
#replybar span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
html[data-theme=dark] #replybar{background:#17212b}
.rp{border-left:3px solid var(--p);background:rgba(51,144,236,.10);border-radius:8px;padding:4px 9px;margin:2px 0 4px;cursor:pointer}
.rp b{display:block;font-size:12px;color:var(--p)}
.rp span{font-size:13px;color:var(--t2);display:block;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.m.me .rp{background:rgba(255,255,255,.16)}
.m.me .rp b{color:#dff0ff}
.fwd{font-size:12px;color:var(--t2);margin-bottom:3px}
.fwd b{color:var(--p)}
.m.me .fwd{color:rgba(255,255,255,.85)}
.m.me .fwd b{color:#cfe8ff}
#pbar{display:flex;align-items:center;gap:8px;margin:4px 10px 0;padding:7px 12px;background:#fff;border-radius:14px;box-shadow:0 1px 6px rgba(16,35,47,.12);cursor:pointer;font-size:14px;user-select:none}
#pbar .pin-i{flex-shrink:0}
#pbar .pin-t{flex:1;min-width:0}
#pbar .pin-t b{display:block;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

<script>
const $ = s => document.querySelector(s);
// Контур значка: окружность с 16 волнами
(() => {
  let d = '';
  for (let i = 0; i <= 320; i++) {
    const t = i / 320 * 2 * Math.PI, r = 11.1 + .9 * Math.cos(16 * t);
    d += (i ? 'L' : 'M') + (12 + r * Math.cos(t)).toFixed(2) + ' ' + (12 + r * Math.sin(t)).toFixed(2);
  }
  document.getElementById('vbp').setAttribute('d', d + 'Z');
})();
const BADGE = '<svg class="vb" role="img" aria-label="Подтверждённый аккаунт"><use href="#vb"/></svg>';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, ws = null, cur = null, query = '', found = [], opened = false;
let cnames = {}; // мои личные имена контактов ({id: 'Мама'}) — вижу только я
let chats = new Map(), msgs = new Map(), typing = new Map(), pend = null;
const msgsEl = $('#msgs');

const setHtml = (el, html) => { if (el._h !== html) { el._h = html; el.innerHTML = html; } }; // не трогаем DOM, если ничего не изменилось
// Подарок-аксессуар рядом с ником; по тапу показывается название и номер
const accH = a => { if (!a) return ''; const k = kindInfo(a.kind); return `<span class="acc" data-acc="${esc(a.kind)}|${a.serial}" style="background:${giftBg(a, k)}">${k.emoji}</span>`; };
const nmH = (name, v, extra = '', acc = null) => `<span class="nm"><span class="nt">${esc(name)}${extra}</span>${v ? BADGE : ''}${accH(acc)}</span>`;
const api = async (url, method = 'GET', body) => {
  const r = await fetch(url, { method, headers: {'Content-Type': 'application/json', ...(me && me.token ? {Authorization: 'Bearer ' + me.token} : {})}, body: body && JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && me && !/\/(login|register)$/.test(url)) logout(d.error || 'Сессия устарела, войдите снова.');
  if (!r.ok) throw new Error(d.error || 'Ошибка сервера');
  return d;
};
const save = () => localStorage.setItem('ovk_user', JSON.stringify(me));
const hm = t => new Date(t).toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'});
const lt = t => { const d = new Date(t); return d.toDateString() === new Date().toDateString() ? hm(t) : d.toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit'}); };
const dl = t => new Date(t).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long'});

/* ---------- Аватарки ---------- */
const hue = s => [...String(s)].reduce((a, c) => a + c.charCodeAt(0) * 31, 0) % 360;
const GHOST = 'ghost';
const ghostAv = (cls = '', on = false) => `<div class="av ${cls} ghost" style="background:linear-gradient(180deg,#ffb55a,#f58a3a)"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#fff" d="M32 8c-11.6 0-20 8.6-20 20v24c0 1.2 1.3 2 2.4 1.4l5.6-3.2 5.6 3.2c.8.5 1.8.5 2.6 0L32 47.2l5.8 3.2c.8.5 1.8.5 2.6 0l5.6-3.2 5.6 3.2c1.1.6 2.4-.2 2.4-1.4V28C52 16.6 43.6 8 32 8z"/><circle cx="24" cy="28" r="4" fill="#f5923e"/><circle cx="40" cy="28" r="4" fill="#f5923e"/></svg>${on ? '<i></i>' : ''}</div>`;
const av = (name, seed, cls = '', on = false, img = '') => img === GHOST ? ghostAv(cls, on) :
  `<div class="av ${cls}" style="background:linear-gradient(180deg,hsl(${hue(seed)} 65% 64%),hsl(${hue(seed)} 60% 48%))">${img ? `<img src="${esc(img)}" alt="">` : esc((name || '?')[0].toUpperCase())}${on ? '<i></i>' : ''}</div>`;
const uav = (u, cls = '', dot = false) => u.banned ? ghostAv(cls, dot && u.online) : av(u.username, u.id, cls, dot && u.online, u.avatar);
const cav = (c, cls = '') => c.type !== 'direct' ? av(c.name, c.id, cls, false, c.avatar) : c.peer ? uav(c.peer, cls, true) : av('?', c.id, cls);
const titleH = c => nmH((c.type === 'channel' ? '📢 ' : '') + title(c),
    c.type === 'direct' ? c.peer && c.peer.verified : !!c.verified,   // галочка: у людей из VERIFIED, у каналов с 5000+
    '', c.type === 'direct' && c.peer ? c.peer.acc : null);
const title = c => c.type !== 'direct' ? c.name : (c.peer ? (cnames[c.peer.id] || c.peer.username) : 'Удалённый аккаунт');

/* ---------- Файлы ---------- */
const fileEl = $('#file');
const pickFile = accept => new Promise(res => {
  fileEl.accept = accept; fileEl.value = '';
  fileEl.multiple = false;
  fileEl.onchange = () => res(fileEl.files[0] || null);
  fileEl.oncancel = () => res(null);
  fileEl.click();
});

// Выбор нескольких файлов/фото
const pickFiles = accept => new Promise(res => {
  fileEl.accept = accept; fileEl.value = '';
  fileEl.multiple = true;
  fileEl.onchange = () => res(Array.from(fileEl.files) || []);
  fileEl.oncancel = () => res([]);
  fileEl.click();
});

// Уменьшает фото перед отправкой; square — квадратная обрезка для аватарок
async function prepImage(file, max, q, square) {
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation: 'from-image'}); }
  catch {
    bmp = new Image(); bmp.src = URL.createObjectURL(file);
    try { await bmp.decode(); } catch { throw new Error('Не удалось открыть фото'); }
    bmp.width = bmp.naturalWidth; bmp.height = bmp.naturalHeight;
  }
  const W = bmp.width, H = bmp.height;
  if (file.type === 'image/gif' && !square) return {blob: file, w: W, h: H};
  let sx = 0, sy = 0, sw = W, sh = H, cw, ch;
  if (square) {
    sw = sh = Math.min(W, H); sx = (W - sw) / 2; sy = (H - sh) / 2;
    cw = ch = Math.min(sw, max);
  } else {
    const k = Math.min(1, max / Math.max(W, H));
    cw = Math.round(W * k); ch = Math.round(H * k);
  }
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cw, ch);
  g.drawImage(bmp, sx, sy, sw, sh, 0, 0, cw, ch);
  bmp.close?.();
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
  if (!blob) throw new Error('Не удалось обработать фото');
  return {blob, w: cw, h: ch};
}
const videoDims = url => new Promise(res => {
  const v = document.createElement('video');
  const done = d => { clearTimeout(t); res(d); };
  const t = setTimeout(() => done({}), 4000);
  v.preload = 'metadata'; v.muted = true;
  v.onloadedmetadata = () => done({w: v.videoWidth, h: v.videoHeight});
  v.onerror = () => done({});
  v.src = url;
});
function upload(blob, kind, onp) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('POST', `/api/upload?userId=${me.id}&kind=${kind}`);
    x.setRequestHeader('Content-Type', blob.type || 'application/octet-stream');
    x.setRequestHeader('Authorization', 'Bearer ' + me.token);
    x.upload.onprogress = e => e.lengthComputable && onp && onp(Math.round(e.loaded / e.total * 100));
    x.onload = () => {
      let d = {}; try { d = JSON.parse(x.responseText); } catch {}
      x.status < 300 ? res(d) : rej(new Error(d.error || 'Не удалось загрузить файл'));
    };
    x.onerror = () => rej(new Error('Нет соединения'));
    x.send(blob);
  });
}
async function uploadAvatar(file) {
  if (!file.type.startsWith('image/')) throw new Error('Выберите фото');
  const r = await prepImage(file, 320, .88, true);
  return (await upload(r.blob, 'avatar')).url;
}

/* ---------- Вход ---------- */
let reg = true;
let cfg = {emailVerify: false, vapidKey: ''};
function authUI() {
  $('#fN').hidden = $('#fH').hidden = !reg;
  $('#fC').hidden = !(reg && cfg.emailVerify);
  $('#el').textContent = reg ? 'Email' : 'Email или @юзернейм';
  $('#authBtn').textContent = reg ? 'Создать аккаунт' : 'Войти';
  $('#tglT').textContent = reg ? 'Уже есть аккаунт?' : 'Нет аккаунта?';
  $('#tgl').textContent = reg ? 'Войти' : 'Регистрация';
  $('#aerr').textContent = '';
  $('#ap').autocomplete = reg ? 'new-password' : 'current-password';
}
$('#tgl').onclick = () => { reg = !reg; authUI(); };
fetch('/api/config').then(r => r.json()).then(c => { cfg = c; authUI(); initPush(); }).catch(() => {});
let codeT = 0;
function startCd(n) {
  clearInterval(codeT);
  const b = $('#acs'); b.disabled = true;
  const tick = () => { if (n <= 0) { clearInterval(codeT); b.disabled = false; b.textContent = 'Отправить ещё раз'; return; } b.textContent = 'Ещё раз через ' + n + ' с'; n--; };
  tick(); codeT = setInterval(tick, 1000);
}
$('#acs').onclick = async () => {
  const b = $('#acs'); $('#aerr').textContent = ''; b.disabled = true;
  try { await api('/api/register/code', 'POST', {email: $('#ae').value}); startCd(60); $('#ac').focus(); toast('Код отправлен на почту. Проверьте и «Спам»'); }
  catch (x) { $('#aerr').textContent = x.message; b.disabled = false; }
};
$('#authForm').onsubmit = async e => {
  e.preventDefault();
  $('#aerr').textContent = '';
  try {
    const d = reg
      ? await api('/api/register', 'POST', {username: $('#an').value, handle: $('#ah').value, email: $('#ae').value, password: $('#ap').value, code: $('#ac').value})
      : await api('/api/login', 'POST', {email: $('#ae').value, password: $('#ap').value});
    me = {...d.user, token: d.token}; save(); boot();
  } catch (x) { $('#aerr').textContent = x.message; }
};

function boot() {
  $('#auth').hidden = true;
  $('#app').hidden = false;
  paintMe(); setMars(me.mars || 0, me.unlimited); renderList(); connect(); loadContacts();
  if (swReg && Notification.permission === 'granted') syncPush(); else paintBell();
}
/* ---------- Уведомления (Web Push) ---------- */
const pushOK = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
let swReg = null, pendingChat = new URLSearchParams(location.search).get('chat');
const urlB64 = s => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function paintBell() {
  const b = $('#pushBtn'); if (!b) return;
  let on = false;
  try { on = pushOK && swReg && Notification.permission === 'granted' && !!await swReg.pushManager.getSubscription(); } catch {}
  b.textContent = on ? '🔔' : '🔕'; b.title = on ? 'Уведомления включены (нажмите, чтобы выключить)' : 'Включить уведомления';
}
async function initPush() {
  if (!pushOK || swReg) return paintBell();
  try { swReg = await navigator.serviceWorker.register('/sw.js'); } catch { return; }
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'openChat' && e.data.chatId && me) goChat(e.data.chatId); });
  if (me && Notification.permission === 'granted') syncPush(); else paintBell();
}
async function syncPush() { // подписываем это устройство на текущий аккаунт
  if (!swReg || !cfg.vapidKey || !me) return;
  try {
    let sub = await swReg.pushManager.getSubscription();
    if (!sub) sub = await swReg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: urlB64(cfg.vapidKey)});
    await api('/api/push/subscribe', 'POST', {subscription: sub.toJSON()});
  } catch (e) { console.warn('push:', e.message); }
  paintBell();
}
async function togglePush() {
  if (!pushOK || !swReg) return toast(/iphone|ipad/i.test(navigator.userAgent) ? 'На iPhone: «Поделиться» → «На экран Домой», затем включите уведомления в приложении' : 'Этот браузер не поддерживает уведомления');
  if (!cfg.vapidKey) return toast('Сервер ещё не готов к уведомлениям, попробуйте позже');
  const sub = await swReg.pushManager.getSubscription();
  if (sub && Notification.permission === 'granted') {
    await api('/api/push/unsubscribe', 'POST', {endpoint: sub.endpoint}).catch(() => {});
    await sub.unsubscribe().catch(() => {});
    paintBell(); return toast('Уведомления выключены');
  }
  const p = await Notification.requestPermission();
  if (p !== 'granted') { paintBell(); return toast('Разрешите уведомления для этого сайта в настройках браузера'); }
  await syncPush(); toast('Уведомления включены 🔔');
}
$('#pushBtn').onclick = togglePush;
const goChat = async id => { if (!chats.has(id)) await loadChats(); if (chats.has(id)) openChat(id); };
// Число непрочитанных в заголовке вкладки
function updTitle() { let n = 0; chats.forEach(c => { n += c.unread || 0; }); document.title = (n ? `(${n > 99 ? '99+' : n}) ` : '') + 'SAIMONGRAM'; }

const curTheme = () => document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme_v2', t); } catch {}
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'dark' ? '#17212b' : '#ffffff';
  const b = $('#themeBtn'); if (b) { b.textContent = t === 'dark' ? '☀️' : '🌙'; b.title = t === 'dark' ? 'Светлая тема' : 'Тёмная тема'; }
}
$('#themeBtn').onclick = () => applyTheme(curTheme() === 'dark' ? 'light' : 'dark');
applyTheme(curTheme());
const paintMe = () => { $('#meBtn').innerHTML = uav(me, 'xs') + '<span>Профиль</span>'; };

function logout(msg) {
  if (swReg && me && me.token) { // это устройство больше не получает чужие уведомления
    const tk = me.token;
    swReg.pushManager.getSubscription().then(s => { if (s) { fetch('/api/push/unsubscribe', {method: 'POST', headers: {Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json'}, body: JSON.stringify({endpoint: s.endpoint})}).catch(() => {}); s.unsubscribe().catch(() => {}); } paintBell(); }).catch(() => {});
  }
  if (me && me.token) fetch('/api/logout', {method: 'POST', headers: {Authorization: 'Bearer ' + me.token}}).catch(() => {});
  localStorage.removeItem('ovk_user');
  me = null; cur = null; query = ''; found = []; pend = null; opened = false;
  if (ws) { ws.onclose = null; ws.close(); }
  chats = new Map(); msgs = new Map(); catalog = new Map(); foundCh = []; blocked = new Set(); editing = null; cnames = {}; replyTo = null;
  closeModal();
  $('#q').value = '';
  $('#app').hidden = true; $('#app').classList.remove('open');
  $('#room').hidden = true; $('#empty').hidden = false;
  $('#auth').hidden = false;
  authUI();
  if (typeof msg === 'string') $('#aerr').textContent = msg;
}

// Проверяем, что аккаунт ещё есть на сервере. Сеть недоступна — остаёмся в аккаунте и ждём
async function checkSession() {
  try {
    me = {...me, ...await api('/api/profile/' + me.id)};
    save(); paintMe();
  } catch (e) {
    if (!me) return false; // api() уже вышел из аккаунта (сессия устарела)
    if (/найден/.test(e.message)) {
      logout('Сервер не нашёл ваш аккаунт: данные на сервере были сброшены. Зарегистрируйтесь или войдите снова.');
      return false;
    }
  }
  return true;
}

/* ---------- Соединение ---------- */
const getMsgs = id => api(`/api/messages/${encodeURIComponent(id)}?userId=${me.id}`);

function connect() {
  if (!me) return;
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = async () => {

async function onWs(m) {

    c.last = d;
    const mine = d.senderId === me.id;
    const l = msgs.get(d.chatId);
    const pi = l && m.cid ? l.findIndex(x => x.cid === m.cid) : -1; // это эхо нашего мгновенно показанного сообщения
    if (pi >= 0) {

    } else if (l && !l.some(x => x.id === d.id)) { l.push(d); if (cur === d.chatId) appendMsg(c, l, mine); }

      clearTimeout(typing.get(d.chatId)); typing.delete(d.chatId);
      if (cur === d.chatId && !document.hidden) markRead(); else c.unread = (c.unread || 0) + 1;
      if (!document.hidden && cur !== d.chatId && c.type !== 'channel' && !(c.peer && c.peer.bot)) toast(`💬 ${title(c)}: ${(d.text || (d.gift ? '🎁 Подарок' : d.media ? '📷 Фото' : '')).slice(0, 60)}`);
    }

  } else if (m.type === 'read') {

    if (cur === d.chatId) updateTicks();

  } else if (m.type === 'presence') {
    chats.forEach(c => {
      if (c.peer && c.peer.id === d.userId) c.peer.online = d.online;
      if (c.members) c.members.forEach(u => { if (u.id === d.userId) u.online = d.online; });
    });
    renderList(); renderHead();
  } else if (m.type === 'typing') {
    clearTimeout(typing.get(d.chatId));
    typing.set(d.chatId, setTimeout(() => { typing.delete(d.chatId); if (cur === d.chatId) renderHead(); }, 3000));
    if (cur === d.chatId) renderHead();
  } else if (m.type === 'chat') {

    if (i >= 0) {

      const c = chats.get(d.chatId), el = cur === d.chatId && bubbleEl(d.messageId);
      if (el && c) el.outerHTML = bubbleHtml(c, l, i);
    }
    const c = chats.get(d.chatId);
    if (c && c.last && c.last.id === d.messageId) { c.last.text = d.text; c.last.edited = d.edited; }
    renderList();
  } else if (m.type === 'reaction') {
    const l = msgs.get(d.chatId), i = l ? l.findIndex(x => x.id === d.messageId) : -1;
    if (i >= 0) {
      if (Object.keys(d.reactions).length) l[i].reactions = d.reactions; else delete l[i].reactions;
      const el = cur === d.chatId && bubbleEl(d.messageId);
      if (el) setRx(el, l[i]);
    }
  } else if (m.type === 'comments') {
    const l = msgs.get(d.chatId), i = l ? l.findIndex(x => x.id === d.messageId) : -1;
    if (i >= 0) {

      if (row) row.outerHTML = cmRow(l[i]);

    const c = chats.get(d.chatId);

    if (cmOpen && cmOpen.postId === d.messageId && $('#cml')) {
      if (d.comment) cmAdd(d.comment); else if (d.removed) $('#cml').querySelector(`[data-c="${d.removed}"]`)?.remove();
    }
  } else if (m.type === 'views') {
    const l = msgs.get(d.chatId);

      if (el && c) el.outerHTML = bubbleHtml(c, l, i);

  } else if (m.type === 'messageDeleted') {
    removeMsg(d.chatId, d.messageId);
  } else if (m.type === 'error') {
    dropPending(d.cid);
    toast(d.text || 'Не удалось отправить сообщение');
  } else if (m.type === 'sold') {
    toast(`💰 ${d.buyer} купил «${kindInfo(d.kind).name} №${d.serial}» за ${d.price} Mars`);
  } else if (m.type === 'wallet') {

    logout('Сессия устарела, войдите снова.');
  }
}

// Формат записи по платформе: webm/opus — идеален для Android/ПК,
// на iPhone Safari пишет mp4 (webm она не играет вообще)
function pickRecMime() {
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const list = isIOS
    ? ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']
    : ['audio/webm;codecs=opus', 'audio/webm;codecs=pcm', 'audio/webm', 'audio/mp4'];
  if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
    for (const t of list) { try { if (MediaRecorder.isTypeSupported(t)) return t; } catch {} }
  }
  return '';
}
async function toggleRec() {
  if (rec) return stopRec(true);
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast('Браузер не поддерживает запись голоса');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = pickRecMime();
    const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    const chunks = [];
    mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec = { mr, chunks, stream, t0: Date.now(), tick: setInterval(paintRec, 250) };
    mr.start(250);
    paintRec();
  } catch { toast('Нет доступа к микрофону. Разреши запись в настройках браузера'); }
}
function stopRec(send) {
  const r = rec; rec = null;
  clearInterval(r.tick);
  r.stream.getTracks().forEach(t => t.stop());
  $('#recbar').hidden = true;
  paintSendMic();
  if (!send) return;
  const dur = Math.round((Date.now() - r.t0) / 1000);
  if (dur < 1) return toast('Слишком короткое сообщение');
  r.mr.onstop = async () => {
    const blob = new Blob(r.chunks, { type: r.mr.mimeType || 'audio/webm' });
    if (!blob.size) return toast('Не удалось записать');
    if (!cur || !ws || ws.readyState !== 1) return toast('Нет соединения');
    try {
      const up = await upload(blob, 'voice');
      sendNow('', { kind: 'voice', url: up.url, dur });
    } catch (x) { toast(x.message); }
  };
  r.mr.stop();
}

      list.innerHTML = r.map(u => `<label class="it" style="padding:6px 0"><input type="checkbox" data-u="${u.id}" ${sel.has(u.id) ? 'checked' : ''}>${uav(u, 's')}<div class="im">${nmH(u.username, u.verified, '', u.acc)}<div class="lm"><span>@${esc(u.handle)}</span></div></div></label>`).join('')
        || '<div class="sec" style="padding-left:0">Никого не нашли</div>';
    } catch {}
  };
  input.oninput = () => { clearTimeout(t); t = setTimeout(find, 250); };
  list.onchange = e => {
    const id = +e.target.dataset.u;
    if (e.target.checked) sel.add(id); else sel.delete(id);
    cnt.textContent = sel.size ? 'Выбрано: ' + sel.size : '';
  };
  find();
  return sel;
}

let catalog = new Map(); // kind -> {emoji, name, price, supply, sold, bg}
const kindInfo = k => catalog.get(k) || {emoji: '🎁', name: 'Подарок', rarity: 'common', price: 0, supply: 0, sold: 0, bg: ['#c9ced6', '#9aa3b0']};
const RARITY = [['common', 'Обычные', 'Обычный'], ['rare', 'Редкие', 'Редкий'], ['epic', 'Эпические', 'Эпический'], ['legendary', 'Легендарные', 'Легендарный']];
const rarityName = r => (RARITY.find(x => x[0] === r) || RARITY[0])[2];
const gradient = k => `linear-gradient(150deg,${k.bg[0]},${k.bg[1]})`;
let backdrops = new Map(); // id -> {name, pct, c}
let patterns = new Map();  // id -> {name, pct, symbol}
const bdOf = g => g && g.bd && backdrops.get(g.bd);
const ptOf = g => g && g.pt && g.pt !== 'none' && patterns.get(g.pt);
const ptTier = p => p <= 1 ? 'Мифический' : p <= 3 ? 'Легендарный' : p <= 8 ? 'Эпический' : p <= 14 ? 'Редкий' : 'Обычный';
const ptLine = g => { const p = ptOf(g); return p ? `Узор «${esc(p.name)}» · ${pctTxt(p.pct)} · ${ptTier(p.pct)}` : 'Без узора'; };
// Фон конкретного подарка (если фона ещё нет — обычный цвет вида подарка)
const giftBg = (g, k) => { const b = bdOf(g); return b ? `linear-gradient(150deg,${b.c[0]},${b.c[1]})` : gradient(k); };
const pctTxt = p => (p < 1 ? String(p) : String(+p.toFixed(1))).replace('.', ',') + '%';
const bdTier = p => p <= 1 ? 'Мифический' : p <= 3 ? 'Легендарный' : p <= 8 ? 'Эпический' : p <= 14 ? 'Редкий' : 'Обычный';
const bdLine = g => { const b = bdOf(g); return b ? `Фон «${esc(b.name)}» · ${pctTxt(b.pct)} · ${bdTier(b.pct)}` : ''; };

const marsTxt = () => me.unlimited ? '∞' : (me.mars || 0);
function setMars(n, unlimited) {
  if (!me) return;
  me.mars = n;
  if (unlimited !== undefined) me.unlimited = !!unlimited;
  save();
  document.querySelectorAll('.mars-n').forEach(e => { e.textContent = marsTxt(); });
}
let toastT;
function toast(t) {
  const el = $('#toast');
  el.textContent = t; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3000);
}

// Рандомные цвета для фона при покупке подарка
const randomBg = () => {
  const colors = [
    {from: '#FF6B6B', to: '#FF8E8E'}, // Красный
    {from: '#4ECDC4', to: '#6FE9DE'}, // Бирюзовый
    {from: '#FFE66D', to: '#FFEB99'}, // Золотой
    {from: '#95E1D3', to: '#B8F0DE'}, // Мятный
    {from: '#F38181', to: '#FF9999'}, // Розовый
    {from: '#AA96DA', to: '#CDBCE8'}, // Фиолетовый
    {from: '#FCBAD3', to: '#FDD4DF'}, // Сиреневый
    {from: '#FFFFD2', to: '#FFFFE6'}, // Кремовый
    {from: '#A8D8EA', to: '#D0E8F2'}, // Небесный
    {from: '#A8E6CF', to: '#C4F5E3'}  // Зелёный
  ];
  return colors[Math.floor(Math.random() * colors.length)];
};

// Красивый эффект при покупке подарка
function giftBought(name, serial) {
  const bg = randomBg();
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;inset:0;z-index:999;background:linear-gradient(135deg,${bg.from},${bg.to});display:flex;align-items:center;justify-content:center;flex-direction:column;animation:popIn .4s ease-out;font-size:64px;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.3)`;
  el.innerHTML = `<div style="font-size:80px;margin-bottom:20px;animation:bounce .6s ease-out">🎁</div><div style="font-weight:700;font-size:28px;text-align:center;animation:slideUp .5s ease-out">${name}</div><div style="font-size:18px;margin-top:10px;opacity:.9">№${serial}</div>`;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; }, 2500);
  setTimeout(() => el.remove(), 2900);
}

async function loadCatalog() {
  try {
    const d = await api('/api/shop');
    catalog = new Map(d.catalog.map(c => [c.kind, c]));
    backdrops = new Map((d.backdrops || []).map(b => [b.id, b]));
    patterns = new Map((d.patterns || []).map(p => [p.id, p]));
    setMars(d.mars, d.unlimited);
    if (cur && msgs.has(cur)) rerender(); // подарки в чате теперь рисуются с картинкой
    renderList(); renderHead(); // аксессуары у ников
  } catch {}

function unCard(u, back) {
    // «а также» — остальные юзернеймы владельца (как в Telegram Fragment)

<div class="mkbar">
  <button type="button" class="chip ${sort==='new'?'on':''}" data-us="new">Новые</button>

<div class="f" style="margin-bottom:10px"><input id="umq" placeholder="Поиск @юзернейма…" value="${esc(q)}" autocapitalize="off" autocomplete="off"></div>

function openGiftMsg(id) {
  const c = chats.get(cur), m = (msgs.get(cur) || []).find(x => x.id === id);
  if (!c || !m || !m.gift) return;
  const mine = m.senderId === me.id, from = mine ? me : c.peer;
  giftInfo({...m.gift, note: m.text, at: m.timestamp, from: from && {id: from.id, username: from.username, handle: from.handle}}, false, closeModal);
}
// Выпадение фона при покупке: рулетка из фонов, останавливается на настоящем
function revealGift(g, k, to, done) {
  const list = [...backdrops.values()], fin = bdOf(g);
  modal(`<div class="gc big" id="rvg" style="background:${gradient(k)}"><div class="gi">${k.emoji}</div><div class="gn">${esc(k.name)}</div></div>
<div class="gh2" id="rvt">🎲 Выбираем фон…</div>
<div class="bdl" id="rvs" style="min-height:20px">${to ? 'Подарок для ' + esc(to.username) : ''}</div>
<div class="row"><button class="btn gok" id="rvok" disabled>OK</button></div>`);
  const box = $('#rvg');
  $('#rvok').onclick = () => { closeModal(); done(); };
  const finish = () => {
    if (!document.body.contains(box)) return;
    box.style.background = giftBg(g, k);
    box.classList.add('pop');
    $('#rvt').textContent = fin ? `Фон «${fin.name}»` : 'Готово!';
    $('#rvs').textContent = (fin ? `${pctTxt(fin.pct)} · ${bdTier(fin.pct)}` : '') + (to ? ` · для ${to.username}` : '');
    $('#rvok').disabled = false;
  };
  if (!fin || list.length < 2) return finish();
  let n = 0;
  (function step() {
    if (!document.body.contains(box)) return;
    if (n >= 18) return finish();
    const b = list[Math.floor(Math.random() * list.length)];
    box.style.background = `linear-gradient(150deg,${b.c[0]},${b.c[1]})`;
    n++;
    setTimeout(step, 60 + n * n * 0.5);
  })();
}

async function loadGifts(uid, box, mine) {
  try {
    const l = await api('/api/gifts/' + uid);
    if (!document.body.contains(box)) return;
    box.innerHTML = l.length ? l.map(giftCard).join('') : '<div style="color:var(--t2);font-size:14px;grid-column:1/-1">Пока нет подарков</div>';
    box.onclick = e => {
      const el = e.target.closest('[data-g]');
      if (el) giftInfo(l.find(g => g.id === el.dataset.g), mine, () => (mine ? myProfile() : closeModal()));
    };
  } catch {}
}

function giftInfo(g, mine, back) {
  if (!g) return;
  const k = kindInfo(g.kind), bd = bdOf(g), price = g.price != null ? g.price : k.price;
  const row = (a, v) => `<div class="gr"><div class="gk">${a}</div><div class="gv">${v}</div></div>`;
  const when = new Date(g.at).toLocaleString('ru-RU', {day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'}).replace(' г.,', ' в');
  modal(`<div class="gc big" style="background:${giftBg(g, k)}"><div class="gi">${k.emoji}</div><div class="gn">${esc(k.name)}</div></div>
<div class="gh2">Подарок</div>
<div class="gtab">
${g.from ? row('От', `${esc(g.from.username)} <span style="color:var(--t2)">@${esc(g.from.handle)}</span>`) : ''}
${row('Дата', esc(when))}
${row('Стоимость', `👽 ${price}`)}
${row('Номер', `№${g.serial}${k.supply ? ' из ' + k.supply : ''} · ${esc(rarityName(k.rarity))}`)}
${row('Узор', ptLine(g))}
${bd ? row('Фон', `${esc(bd.name)} · ${pctTxt(bd.pct)} · ${bdTier(bd.pct)}`) : ''}
${g.note ? `<div class="gr"><div class="gv gnv">${esc(g.note)}</div></div>` : ''}
</div>
<div class="err" id="ge"></div>
<div class="row"><button class="btn gok" id="gbk">OK</button></div>
${mine ? `${g.listing ? '' : `<div class="row"><button class="btn g gok" id="gwr">${me.acc && me.acc.gid === g.id ? '✨ Снять с ника' : '✨ Носить рядом с ником'}</button></div>`}<div class="row"><button class="btn g gok" id="gsl">${g.listing ? `💰 На рынке за ${g.listing.price} Mars — изменить` : '💰 Продать на рынке'}</button></div>${g.listing ? '<div class="row"><button class="btn r gok" id="gun">Снять с продажи</button></div>' : ''}<div class="row"><button class="btn g gok" id="gtr">Передать</button></div>` : ''}`);
  $('#gbk').onclick = back;
  if (mine) {
    $('#gsl').onclick = () => askPrice(g, k, () => giftInfo(g, mine, back));
    if (g.listing) $('#gun').onclick = async () => {
      try { await api('/api/market/unlist', 'POST', {giftId: g.id}); delete g.listing; toast('Подарок снят с продажи'); giftInfo(g, mine, back); }
      catch (x) { const e = $('#ge'); if (e) e.textContent = x.message; }
    };
  }
  if (mine && $('#gwr')) $('#gwr').onclick = async () => {
    const on = !(me.acc && me.acc.gid === g.id), b = $('#gwr'); b.disabled = true;
    try {
      const r = await api(`/api/gifts/${encodeURIComponent(g.id)}/wear`, 'POST', {on});
      if (r.acc) me.acc = r.acc; else delete me.acc;
      save(); toast(on ? 'Подарок теперь рядом с вашим ником' : 'Подарок снят с ника');
      giftInfo(g, mine, back); renderList(); renderHead();
    } catch (x) { const e = $('#ge'); if (e) e.textContent = x.message; b.disabled = false; }
  };

    api(`/api/gifts/${encodeURIComponent(g.id)}/transfer`, 'POST', {toId: u.id})
      .then(() => { if (me.acc && me.acc.gid === g.id) { delete me.acc; save(); } toast('Подарок передан'); myProfile(); })
      .catch(x => alert(x.message));
  }, () => giftInfo(g, mine, back));

/* ---------- Сообщения: изменить, удалить, мгновенная отправка ---------- */
let editing = null, cidN = 0;

// Сообщение появляется сразу, подтверждение от сервера лишь заменяет его
function sendNow(text, media) {
  const c = chats.get(cur), l = msgs.get(cur);
  const cid = 'c' + Date.now().toString(36) + (cidN++);
  ws.send(JSON.stringify({type: 'message', chatId: cur, text, media, cid, ...(replyTo && {reply: {id: replyTo.id}})}));
  if (!c || !l) return;
  const m = {id: 'tmp_' + cid, cid, chatId: cur, senderId: me.id, text, timestamp: new Date().toISOString(), pending: true};
  if (media) m.media = media;
  if (replyTo) m.reply = replyTo;
  stopReply();
  l.push(m);
  c.last = m;
  appendMsg(c, l, true);
  renderList();
}
// ---------- Ответ на сообщение ----------
let replyTo = null;
function startReply(id) {
  const c = chats.get(cur), m = (msgs.get(cur) || []).find(x => x.id === id);
  if (!m) return;
  stopEdit();
  let name = 'Сообщение';
  if (m.senderId === me.id) name = 'Вы';
  else if (c.type === 'direct') name = title(c);
  else if (c.type === 'group') { const u = c.members.find(x => x.id === m.senderId); if (u) name = cnames[u.id] || u.username; }
  else if (m.sn) name = m.sn;
  else { const u = (c.members || []).find(x => x.id === m.senderId); if (u) name = cnames[u.id] || u.username; }
  replyTo = { id: m.id, name, text: String(m.text || '').slice(0, 90), mk: m.media ? m.media.kind : (m.gift ? 'gift' : '') };
  const lbl = replyTo.mk === 'voice' ? '🎤 Голосовое сообщение' : replyTo.mk === 'image' ? '📷 Фото' : replyTo.mk === 'video' ? '🎥 Видео' : replyTo.mk === 'gift' ? '🎁 Подарок' : replyTo.text;
  $('#replybar').hidden = false;
  $('#replytxt').textContent = `↩️ Ответить ${name}: ${lbl}`;
  inp.focus();
}
function stopReply() {
  if (!replyTo) return;
  replyTo = null;
  $('#replybar').hidden = true;
}
$('#rcancel').onclick = stopReply;

// ---------- Пересылка сообщения ----------
function forwardPick(id) {
  const m = (msgs.get(cur) || []).find(x => x.id === id);
  if (!m) return;
  const targets = [...chats.values()].filter(c => c.id !== cur && (c.type !== 'channel' || c.creator === me.id || c.open));
  if (!targets.length) return toast('Нет чатов для пересылки');
  modal(`<h2 style="margin-bottom:12px">Переслать в…</h2>
${targets.map(c => `<div class="row" style="margin-top:0"><button class="btn g" data-fc="${esc(c.id)}">${esc(c.type === 'direct' ? title(c) : (c.type === 'channel' ? '📢 ' : '👥 ') + c.name)}</button></div>`).join('')}
<div class="row"><button type="button" class="btn g" data-x>Отмена</button></div>`);
  $('#card').querySelectorAll('[data-fc]').forEach(b => b.onclick = () => {
    closeModal();
    if (!ws || ws.readyState !== 1) return toast('Нет соединения');
    ws.send(JSON.stringify({type: 'message', chatId: b.dataset.fc, text: m.text || '', media: m.media, fwd: {from: m.senderId}}));
    toast('Переслано ✓');
  });
}

// ---------- Закрепление ----------
async function togglePin(id) {
  const c = chats.get(cur);
  if (!c) return;
  const on = !((c.pins || []).includes(id));
  try {
    await api(`/api/chats/${encodeURIComponent(cur)}/pin`, 'POST', {messageId: id, on});
    toast(on ? '📌 Закреплено' : 'Откреплено');
    await loadChats();
  } catch (x) { toast(x.message); }
}
function renderPins() {
  const el = $('#pbar');
  if (!el) return;
  const c = chats.get(cur);
  if (!c || !c.pins || !c.pins.length || $('#room').hidden) { el.hidden = true; el.innerHTML = ''; return; }
  const p = c.pins[0];
  const more = c.pins.length > 1 ? ` <span style="color:var(--t2)">+${c.pins.length - 1}</span>` : '';
  el.hidden = false;
  el.innerHTML = `<span class="pin-i">📌${more}</span><div class="pin-t"><b>${esc(p.name)}</b><span>${p.media === 'voice' ? '🎤 Голосовое' : p.media === 'image' ? '📷 Фото' : p.media === 'video' ? '🎥 Видео' : p.media === 'gift' ? '🎁 Подарок' : esc(p.text || '')}</span></div><button class="ib" id="pinoff" aria-label="Открепить">✕</button>`;
  el.onclick = e => {
    if (e.target.closest('#pinoff')) { togglePin(p.id); return; }
    jumpToMsg(p.id);
  };
}

// ---------- Прыжок к сообщению (закрепы, ответы, поиск) ----------
function jumpToMsg(id) {
  const l = msgs.get(cur);
  if (!l || !l.some(x => x.id === id)) return toast('Сообщение не загружено — оно старше последних 500');
  const el = bubbleEl(id);
  if (!el) return;
  el.scrollIntoView({block: 'center', behavior: 'smooth'});
  lockStick = Date.now() + 800; stick = false;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1800);
}

function dropPending(cid) { // сервер отклонил сообщение
  const l = msgs.get(cur), i = l ? l.findIndex(x => x.cid === cid) : -1;
  if (i < 0) return;
  l.splice(i, 1);
  const c = chats.get(cur);
  if (c) c.last = l[l.length - 1] || null;
  rerender(); renderList();
}
function removeMsg(chatId, id) {
  const l = msgs.get(chatId), i = l ? l.findIndex(x => x.id === id) : -1;
  if (i >= 0) { l.splice(i, 1); if (cur === chatId) rerender(); }
  const c = chats.get(chatId);
  if (c && c.last && c.last.id === id) c.last = l && l.length ? l[l.length - 1] : null;
  renderList();
  loadChatsSoon(); // подтянуть настоящее «последнее сообщение»
}

function msgMenu(id) {
  const m = (msgs.get(cur) || []).find(x => x.id === id);
  if (!m || m.pending) return;
  const c0 = chats.get(cur) || {};
  const pinned = (c0.pins || []).includes(id);
  const mine = m.senderId === me.id;
  modal(`<h2 style="margin-bottom:12px">Сообщение</h2>
<div class="row" style="margin-top:0"><button class="btn g" id="mm-reply">↩️ Ответить</button></div>
${m.gift ? '' : '<div class="row"><button class="btn g" id="mm-fwd">↪️ Переслать</button></div>'}
<div class="row"><button class="btn g" id="mm-pin">${pinned ? '📍 Открепить' : '📌 Закрепить'}</button><button class="btn g" id="mm-find">🔍 В чате</button></div>
${mine && !m.gift ? '<div class="row"><button class="btn g" id="mm-edit">✏️ Изменить</button></div>' : ''}
${mine ? '<div class="row"><button class="btn r" id="mm-del">🗑 Удалить</button></div>' : ''}
<div class="row"><button type="button" class="btn g" data-x>Отмена</button></div>`);
  $('#mm-reply').onclick = () => { closeModal(); startReply(id); };
  if ($('#mm-fwd')) $('#mm-fwd').onclick = () => { closeModal(); forwardPick(id); };
  $('#mm-pin').onclick = () => { closeModal(); togglePin(id); };
  $('#mm-find').onclick = () => { closeModal(); $('#sbar').hidden = false; $('#sres').hidden = true; $('#si').value = ''; $('#si').focus(); };
  if ($('#mm-edit')) $('#mm-edit').onclick = () => { closeModal(); startEdit(id); };
  if ($('#mm-del')) $('#mm-del').onclick = async () => {
    if (!confirm('Удалить сообщение у всех?')) return;
    try { await api('/api/messages/' + encodeURIComponent(id), 'DELETE'); closeModal(); removeMsg(cur, id); toast('Сообщение удалено'); }
    catch (x) { toast(x.message); }
  };
}
function startEdit(id) {
  const m = (msgs.get(cur) || []).find(x => x.id === id);
  if (!m || m.gift) return;
  stopReply();
  editing = id; pend = null; drawPend();
  $('#editbar').hidden = false;
  inp.value = m.text || ''; fit(); paintSendMic(); inp.focus();
}
function stopEdit() {
  if (!editing) return;
  editing = null;
  $('#editbar').hidden = true;
  inp.value = ''; fit(); paintSendMic();
}
$('#ecancel').onclick = stopEdit;
async function saveEdit(text) {
  const l = msgs.get(cur) || [], m = l.find(x => x.id === editing);
  if (!m) return stopEdit();
  if (!text && !m.media) return;
  if (text === (m.text || '')) return stopEdit();
  try { await api('/api/messages/' + encodeURIComponent(editing), 'PUT', {text}); stopEdit(); }
  catch (x) { toast(x.message); }
}

/* ---------- Блокировка и удаление чатов ---------- */
let blocked = new Set();
async function loadBlocks() {
  try { blocked = new Set((await api('/api/blocks')).blocked); renderHead(); } catch {}
}
async function loadContacts() {
  try { cnames = await api('/api/contacts'); renderList(); renderHead(); if (cur && msgs.has(cur)) rerender(); } catch {}
}
// Перерисовать имена везде после смены имени контакта
function repaintNames() { renderList(); renderHead(); if (cur && msgs.has(cur)) rerender(); }
async function toggleBlock(u, reopen) {
  const was = blocked.has(u.id);
  if (!was && !confirm(`Заблокировать ${u.username}? Вы не сможете переписываться и обмениваться подарками.`)) return;
  try {
    await api(`/api/${was ? 'unblock' : 'block'}/${u.id}`, 'POST', {});
    if (was) blocked.delete(u.id); else blocked.add(u.id);
    toast(was ? 'Пользователь разблокирован' : 'Пользователь заблокирован');
    renderHead();
    if (reopen) userProfile(u); else closeModal();
  } catch (x) { toast(x.message); }
}
$('#rdonly').onclick = async e => {
  if (e.target.id === 'botstart') {
    e.target.disabled = true;
    try { await api('/api/bot/start', 'POST', {}); } catch (x) { toast(x.message); }
    e.target.disabled = false;
    return;
  }
  if (e.target.id !== 'unb') return;
  const c = chats.get(cur);
  if (c && c.peer) toggleBlock(c.peer, false);
};
async function blockedList() {
  modal('<div class="sec" style="padding:0">Загрузка…</div>');
  try {
    const d = await api('/api/blocks');
    blocked = new Set(d.blocked);
    modal(`<h2 style="margin-bottom:12px">Заблокированные</h2>${d.users.length ? d.users.map(u =>
      `<div class="it" style="padding-left:0;padding-right:0;cursor:default">${uav(u, 's')}<div class="im">${nmH(u.username, u.verified, '', u.acc)}<div class="lm"><span>@${esc(u.handle)}</span></div></div><button class="lnk" data-ub="${u.id}">Разблокировать</button></div>`).join('')
      : '<div class="sec" style="padding-left:0">Список пуст</div>'}
<div class="row"><button type="button" class="btn g" id="bkb">Назад</button></div>`);
    $('#bkb').onclick = myProfile;
    $('#card').querySelectorAll('[data-ub]').forEach(b => b.onclick = async () => {
      try { await api('/api/unblock/' + b.dataset.ub, 'POST', {}); blocked.delete(+b.dataset.ub); renderHead(); blockedList(); }
      catch (x) { toast(x.message); }
    });
  } catch (x) { modal(`<div class="err">${esc(x.message)}</div><div class="row"><button type="button" class="btn g" data-x>Закрыть</button></div>`); }
}

function chatMenu(id) {
  const c = chats.get(id);
  if (!c) return;
  let items;
  if (c.type === 'direct') {
    const bl = c.peer && blocked.has(c.peer.id);
    items = [...(c.peer ? [['prof', '👤 Профиль', 'g'], [bl ? 'unb' : 'blk', bl ? '✅ Разблокировать' : '🚫 Заблокировать', bl ? 'g' : 'r']] : []), ['del', '🗑 Удалить чат', 'r']];
  } else if (c.type === 'group') {
    items = [['info', 'ℹ️ О группе', 'g'], ['leave', '🚪 Покинуть группу', 'r'], ...(c.creator === me.id ? [['delall', '🗑 Удалить группу для всех', 'r']] : [])];
  } else {
    items = [['info', 'ℹ️ О канале', 'g'], c.creator === me.id ? ['delall', '🗑 Удалить канал', 'r'] : ['leave', '🚪 Отписаться', 'r']];
  }
  modal(`<h2 style="margin-bottom:6px">${esc(title(c))}</h2>${items.map(([k, t, cls]) =>
    `<div class="row"><button class="btn ${cls}" data-a="${k}">${t}</button></div>`).join('')}
<div class="row"><button type="button" class="btn g" data-x>Отмена</button></div>`);
  $('#card').querySelectorAll('[data-a]').forEach(b => b.onclick = () => chatAction(c, b.dataset.a));
}
function chatAction(c, a) {
  if (a === 'prof') return userProfile(c.peer);
  if (a === 'info') return c.type === 'group' ? groupInfo(c.id) : channelInfo(c.id);
  if (a === 'blk' || a === 'unb') return toggleBlock(c.peer, false);
  if (a === 'del') { // личный чат: у меня или у обоих
    modal(`<h2 style="margin-bottom:6px">Удалить чат с ${esc(title(c))}?</h2>
<div class="row"><button class="btn r" id="d1">Удалить у меня</button></div>
<div class="row"><button class="btn r" id="d2">Удалить у обоих</button></div>
<div class="row"><button type="button" class="btn g" data-x>Отмена</button></div>`);
    $('#d1').onclick = () => doDeleteChat(c, false);
    $('#d2').onclick = () => { if (confirm('Переписка будет удалена и у собеседника. Продолжить?')) doDeleteChat(c, true); };
    return;
  }
  const all = a === 'delall';
  const q = all ? (c.type === 'group' ? 'Удалить группу и всю переписку для всех участников?' : 'Удалить канал и все его посты навсегда?')
    : c.type === 'group' ? 'Покинуть группу?' : 'Отписаться от канала?';
  if (confirm(q)) doDeleteChat(c, all);
}
async function doDeleteChat(c, both) {
  try {
    await api(`/api/chats/${encodeURIComponent(c.id)}${both ? '?both=1' : ''}`, 'DELETE');
    chats.delete(c.id); msgs.delete(c.id);
    if (cur === c.id) $('#back').click();
    closeModal(); renderList();
    toast('Готово');
  } catch (x) { toast(x.message); }
}
$('#more').onclick = () => { if (cur) chatMenu(cur); };
$('#list').oncontextmenu = e => { // правый клик / долгое нажатие по чату в списке
  const it = e.target.closest('.it[data-c]');
  if (it) { e.preventDefault(); chatMenu(it.dataset.c); }
};

/* ---------- Клавиатура на телефоне: подгоняем высоту под видимую область ---------- */
if (window.visualViewport) {
  const vv = visualViewport;
  const fitVV = () => {
    $('#app').style.height = vv.height + 'px';
    if (/INPUT|TEXTAREA/.test(document.activeElement?.tagName || '')) window.scrollTo(0, 0);
  };
  vv.addEventListener('resize', fitVV);
  vv.addEventListener('scroll', fitVV);
}

/* ---------- Запуск ---------- */
(async () => {
  authUI();
  try { me = JSON.parse(localStorage.getItem('ovk_user')); } catch { me = null; }
  if (me && await checkSession()) boot();
})();
</script>
</body>
</html>
