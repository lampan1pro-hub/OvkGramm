<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAIMONGRAM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#0084ff;--pd:#0066cc;--pl:#e7f3ff;--bg:#f0f2f5;--t:#111;--t2:#65676b;--b:#e5e5ea;--on:#31a24c}
html,body{height:100%}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--t);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:disabled{opacity:.5;cursor:default}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;color:var(--t2);margin-bottom:4px}
.f input,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:8px;font-size:16px}
.f input:focus,.f textarea:focus{outline:0;border-color:var(--p);background:var(--pl)}
.btn{width:100%;padding:11px;border-radius:8px;font-weight:600;background:var(--p);color:#fff;transition:all .2s ease;transform-origin:center}
.btn:hover:not(:disabled){background:var(--pd);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,132,255,.2)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn.g{background:var(--bg);color:var(--p)}
.btn.r{background:#fdecea;color:#d33}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{flex:1}
.err{color:#d33;font-size:13px;min-height:18px;margin:4px 0}
.lnk{color:var(--p);font-weight:600;padding:6px 10px}
/* вход */
#auth{height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;background:linear-gradient(135deg,#0084ff,#0066cc)}
.card{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:400px;max-height:92dvh;overflow:auto}
.logo{font-size:30px;font-weight:800;color:var(--p);text-align:center}
.tag{text-align:center;color:var(--t2);font-size:14px;margin-bottom:20px}
.tg{text-align:center;margin-top:14px;font-size:14px;color:var(--t2)}
.tg button{color:var(--p);font-weight:600}
/* каркас */
#app{display:flex;height:100dvh;background:#fff;position:relative;overflow:hidden}
#side{width:360px;border-right:1px solid var(--b);display:flex;flex-direction:column;flex-shrink:0}
.sh{display:flex;align-items:center;gap:10px;padding:10px 14px}
.sh h1{flex:1;min-width:0;font-size:22px;font-weight:800;color:var(--p);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;background:var(--bg);font-size:20px;display:grid;place-items:center;flex-shrink:0}
.ib:hover{background:#e4e6ea}
#meBtn{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:24px;background:var(--bg);font-weight:600;font-size:14px;flex-shrink:0}
#meBtn:hover{background:#e4e6ea}
#conn{background:#fff3cd;color:#856404;font-size:12px;text-align:center;padding:4px}
#q{margin:0 14px 8px;padding:10px 16px;border:1px solid transparent;background:var(--bg);border-radius:22px;font-size:16px}
#q:focus{outline:0;background:#fff;border-color:var(--p)}
#list{flex:1;overflow-y:auto}
.it{display:flex;gap:12px;padding:10px 14px;cursor:pointer;align-items:center;transition:background .15s ease;animation:slideIn .3s ease-out}
.it:hover{background:var(--bg);transform:translateX(2px)}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.it.on{background:var(--pl)}
.sec{padding:10px 14px 4px;font-size:13px;color:var(--t2);font-weight:600}
.av{position:relative;width:48px;height:48px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:#fff;font-weight:600;font-size:18px}
.av.s{width:40px;height:40px;font-size:16px}
.av.xs{width:32px;height:32px;font-size:14px}
.av.l{width:96px;height:96px;font-size:38px;margin:0 auto}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av i{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--on);border:2px solid #fff}
.im{flex:1;min-width:0}
.r1,.lm{display:flex;justify-content:space-between;gap:8px}
.nm{display:flex;align-items:center;gap:4px;min-width:0;font-weight:600}
.nm .nt{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.vb{width:1.05em;height:1.05em;flex-shrink:0;vertical-align:-.18em}
.tm{font-size:12px;color:var(--t2);flex-shrink:0}
.lm{color:var(--t2);font-size:14px}
.lm span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bd{background:var(--p);color:#fff;border-radius:10px;min-width:20px;padding:0 6px;font-size:12px;line-height:20px;text-align:center}
.tk{font-size:12px;letter-spacing:-2px}
.tm .tk{margin-right:5px}
.tm .tk.rd{color:var(--p)}
/* чат */
#chat{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
#empty{margin:auto;text-align:center;color:var(--t2);padding:20px}
#room{flex:1;min-height:0;display:flex;flex-direction:column}
.rh{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--b)}
#back{display:none}
#hd{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
#hd small{display:block;color:var(--t2);font-size:13px}
#hd small.ty{color:var(--p)}
#msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.day{align-self:center;font-size:12px;color:var(--t2);background:#fff;padding:2px 10px;border-radius:10px;margin:8px 0}
.m{max-width:min(70%,520px);padding:7px 11px;border-radius:18px 18px 18px 4px;background:#fff;overflow-wrap:anywhere;white-space:pre-wrap;align-self:flex-start;animation:msgIn .3s ease-out;transition:all .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.m.me{align-self:flex-end;background:var(--p);color:#fff;border-radius:18px 18px 4px 18px}
.m b{display:block;font-size:12px;color:var(--p)}
.m time{font-size:11px;color:var(--t2);margin-left:8px;float:right;margin-top:6px}
.m.me time{color:rgba(255,255,255,.75)}
.m .tk{margin-left:5px}
.m.me .tk.rd{color:#b6f0ff}
.m video,.m img.ph{display:block;width:340px;max-width:100%;max-height:420px;border-radius:15px;object-fit:cover;background:#000;cursor:pointer}
.m video{object-fit:contain;cursor:default}
.m.mm{padding:3px;border-radius:18px}
.m.mm b{padding:3px 8px 0}
.m.mm .tx{display:block;padding:5px 8px 0}
.m.mm time{display:block;float:none;text-align:right;padding:2px 8px 2px;margin:0}
#pend{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-top:1px solid var(--b)}
#pend .th{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#000;flex-shrink:0}
#pend .st{flex:1;font-size:14px;color:var(--t2)}
#form{display:flex;gap:8px;align-items:flex-end;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--b)}
#pend:not([hidden])+#form{border-top:0}
#inp{flex:1;resize:none;max-height:120px;padding:9px 14px;border:1px solid var(--b);border-radius:20px;font-size:16px;line-height:1.3;display:block}
#inp:focus{outline:0;border-color:var(--p)}
#send{width:40px;height:40px;border-radius:50%;background:var(--p);color:#fff;font-size:16px;flex-shrink:0}
/* окна */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;animation:fadeIn .2s ease;backdrop-filter:blur(2px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal .card{animation:slideUp .3s cubic-bezier(.34,.69,.76,1)}
.modal h2{font-size:20px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#wallet{display:flex;justify-content:space-between;align-items:center;width:calc(100% - 28px);margin:0 14px 8px;padding:9px 14px;border-radius:12px;background:linear-gradient(90deg,#fff1e6,#ffe0f0);font-weight:600;font-size:14px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.gc{border-radius:14px;padding:10px 6px 8px;text-align:center;color:#fff;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.25);user-select:none}
.gc.off{opacity:.45;cursor:default}
.gc .gi{font-size:34px;line-height:1.15}
.gc .gn{font-size:12px;font-weight:600;margin-top:2px}
.gc .gs{font-size:11px;opacity:.92}
.gc.big{padding:22px 10px;max-width:200px;margin:0 auto;cursor:default}
.gc.big .gi{font-size:72px}
.gc.big .gn{font-size:16px}
.gb{border-radius:16px;padding:14px 20px;min-width:190px;text-align:center;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);white-space:normal}
.gb .gi{font-size:56px;line-height:1.2}
.gb .gt{font-size:12px;opacity:.95}
.gb .gn{font-weight:700}
.m.ch{max-width:min(85%,560px)}
#rdonly{padding:12px 12px calc(12px + env(safe-area-inset-bottom));text-align:center;color:var(--t2);background:#fff;border-top:1px solid var(--b);font-size:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:30;font-size:14px;max-width:90%;text-align:center}
@media(max-width:400px){.sh h1{font-size:19px}}
@media(max-width:340px){#meBtn span{display:none}#meBtn{padding:4px}}
@media(max-width:768px){
#side{width:100%}
#chat{position:absolute;inset:0;transform:translateX(100%);transition:transform .2s;z-index:5}
#app.open #chat{transform:none}
#back{display:grid}
.m{max-width:85%}
}
@media(prefers-reduced-motion:reduce){#chat{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="vb" viewBox="0 0 24 24">
    <path id="vbp" fill="#19b4ff"/>
    <path d="M7.6 12.4l3 3 5.8-6.4" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<div id="auth">
  <form class="card" id="authForm">
    <div class="logo">SAIMONGRAM</div>
    <p class="tag">Реальное общение с друзьями</p>
    <div class="f" id="fN"><label>Имя</label><input id="an" maxlength="40" autocomplete="name"></div>
    <div class="f" id="fH"><label>Юзернейм</label><input id="ah" maxlength="21" autocapitalize="off" autocomplete="off" placeholder="латиница, цифры и _"></div>
    <div class="f"><label id="el">Email</label><input id="ae" autocapitalize="off" autocomplete="username"></div>
    <div class="f"><label>Пароль</label><input id="ap" type="password" autocomplete="current-password" placeholder="Минимум 6 символов"></div>
    <div class="err" id="aerr"></div>
    <button class="btn" id="authBtn"></button>
    <p class="tg"><span id="tglT"></span> <button type="button" id="tgl"></button></p>
  </form>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="sh">
      <h1>SAIMONGRAM</h1>
      <button class="ib" id="newGroup" title="Создать группу или канал">＋</button>
      <button id="meBtn" title="Мой профиль"></button>
    </div>
    <div id="conn" hidden>Нет соединения, переподключаюсь…</div>
    <button id="wallet" type="button"><span>🎁 Подарки</span><span>👽 <b class="mars-n">0</b> Mars</span></button>
    <input id="q" placeholder="Поиск людей и каналов" autocomplete="off" autocapitalize="off">
    <div id="list"></div>
  </aside>
  <main id="chat">
    <div id="empty"><div style="font-size:56px;opacity:.35">💬</div><h2>Выберите чат</h2><p>Или найдите человека через поиск слева</p></div>
    <section id="room" hidden>
      <div class="rh">
        <button class="ib" id="back" aria-label="Назад">‹</button>
        <div id="hd"></div>
      </div>
      <div id="msgs"></div>
      <div id="pend" hidden></div>
      <form id="form">
        <button type="button" class="ib" id="attach" aria-label="Прикрепить фото или видео">📎</button>
        <textarea id="inp" rows="1" placeholder="Сообщение" enterkeyhint="send"></textarea>
        <button id="send" aria-label="Отправить">➤</button>
      </form>
      <div id="rdonly" hidden>Писать в канал может только его автор</div>
    </section>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="card" id="card"></div></div>
<div id="toast" hidden></div>
<div id="lb" hidden><img id="lbi" alt=""></div>
<input type="file" id="file" hidden>

<script>
const $ = s => document.querySelector(s);
// Контур значка: окружность с 16 волнами
(() => {
  let d = '';
  for (let i = 0; i <= 320; i++) {
    const t = i / 320 * 2 * Math.PI, r = 11.1 + .9 * Math.cos(16 * t);
    d += (i ? 'L' : 'M') + (12 + r * Math.cos(t)).toFixed(2) + ' ' + (12 + r * Math.sin(t)).toFixed(2);
  }
  document.getElementById('vbp').setAttribute('d', d + 'Z');
})();
const BADGE = '<svg class="vb" role="img" aria-label="Подтверждённый аккаунт"><use href="#vb"/></svg>';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, ws = null, cur = null, query = '', found = [], opened = false;
let chats = new Map(), msgs = new Map(), typing = new Map(), pend = null;
const msgsEl = $('#msgs');

const nmH = (name, v, extra = '') => `<span class="nm"><span class="nt">${esc(name)}${extra}</span>${v ? BADGE : ''}</span>`;
const api = async (url, method = 'GET', body) => {
  const r = await fetch(url, { method, headers: {'Content-Type': 'application/json', ...(me && me.token ? {Authorization: 'Bearer ' + me.token} : {})}, body: body && JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && me && !/\/(login|register)$/.test(url)) logout(d.error || 'Сессия устарела, войдите снова.');
  if (!r.ok) throw new Error(d.error || 'Ошибка сервера');
  return d;
};
const save = () => localStorage.setItem('ovk_user', JSON.stringify(me));
const hm = t => new Date(t).toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'});
const lt = t => { const d = new Date(t); return d.toDateString() === new Date().toDateString() ? hm(t) : d.toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit'}); };
const dl = t => new Date(t).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long'});

// Функции для управления сообщениями и чатами
const deleteMessage = async (messageId, chatId) => {
  if (!confirm('Удалить сообщение?')) return;
  try {
    await api(`/api/messages/${messageId}`, 'DELETE');
    const msgs = await getMsgs(chatId);
    renderMsgs();
    toast('✅ Сообщение удалено');
  } catch (e) { alert(e.message); }
};

const editMessage = async (messageId, currentText, chatId) => {
  const newText = prompt('Изменить сообщение:', currentText);
  if (newText === null || newText.trim() === '') return;
  try {
    await api(`/api/messages/${messageId}`, 'PUT', {text: newText});
    const msgs = await getMsgs(chatId);
    renderMsgs();
    toast('✅ Сообщение изменено');
  } catch (e) { alert(e.message); }
};

const deleteChat = async (chatId) => {
  if (!confirm('Удалить этот чат?')) return;
  try {
    await api(`/api/chats/${chatId}`, 'DELETE');
    cur = null;
    open(null);
    const chats = await api(`/api/chats/${me.id}`);
    renderList(chats);
    toast('✅ Чат удален');
  } catch (e) { alert(e.message); }
};

const blockUser = async (userId) => {
  if (!confirm('Заблокировать этого пользователя?')) return;
  try {
    await api(`/api/block/${userId}`, 'POST');
    toast('✅ Пользователь заблокирован');
  } catch (e) { alert(e.message); }
};

// toast объявлен один раз ниже (в разделе подарков)

/* ---------- Аватарки ---------- */
const hue = s => [...String(s)].reduce((a, c) => a + c.charCodeAt(0) * 31, 0) % 360;
const av = (name, seed, cls = '', on = false, img = '') =>
  `<div class="av ${cls}" style="background:hsl(${hue(seed)} 50% 48%)">${img ? `<img src="${esc(img)}" alt="">` : esc((name || '?')[0].toUpperCase())}${on ? '<i></i>' : ''}</div>`;
const uav = (u, cls = '', dot = false) => av(u.username, u.id, cls, dot && u.online, u.avatar);
const cav = (c, cls = '') => c.type !== 'direct' ? av(c.name, c.id, cls, false, c.avatar) : c.peer ? uav(c.peer, cls, true) : av('?', c.id, cls);
const titleH = c => nmH((c.type === 'channel' ? '📢 ' : '') + title(c), c.type === 'direct' && c.peer && c.peer.verified);
const title = c => c.type !== 'direct' ? c.name : (c.peer ? c.peer.username : 'Удалённый аккаунт');

/* ---------- Файлы ---------- */
const fileEl = $('#file');
const pickFile = accept => new Promise(res => {
  fileEl.accept = accept; fileEl.value = '';
  fileEl.onchange = () => res(fileEl.files[0] || null);
  fileEl.oncancel = () => res(null);
  fileEl.click();
});

// Уменьшает фото перед отправкой; square — квадратная обрезка для аватарок
async function prepImage(file, max, q, square) {
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation: 'from-image'}); }
  catch {
    bmp = new Image(); bmp.src = URL.createObjectURL(file);
    try { await bmp.decode(); } catch { throw new Error('Не удалось открыть фото'); }
    bmp.width = bmp.naturalWidth; bmp.height = bmp.naturalHeight;
  }
  const W = bmp.width, H = bmp.height;
  if (file.type === 'image/gif' && !square) return {blob: file, w: W, h: H};
  let sx = 0, sy = 0, sw = W, sh = H, cw, ch;
  if (square) {
    sw = sh = Math.min(W, H); sx = (W - sw) / 2; sy = (H - sh) / 2;
    cw = ch = Math.min(sw, max);
  } else {
    const k = Math.min(1, max / Math.max(W, H));
    cw = Math.round(W * k); ch = Math.round(H * k);
  }
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cw, ch);
  g.drawImage(bmp, sx, sy, sw, sh, 0, 0, cw, ch);
  bmp.close?.();
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
  if (!blob) throw new Error('Не удалось обработать фото');
  return {blob, w: cw, h: ch};
}
const videoDims = url => new Promise(res => {
  const v = document.createElement('video');
  const done = d => { clearTimeout(t); res(d); };
  const t = setTimeout(() => done({}), 4000);
  v.preload = 'metadata'; v.muted = true;
  v.onloadedmetadata = () => done({w: v.videoWidth, h: v.videoHeight});
  v.onerror = () => done({});
  v.src = url;
});
function upload(blob, kind, onp) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('POST', `/api/upload?userId=${me.id}&kind=${kind}`);
    x.setRequestHeader('Content-Type', blob.type || 'application/octet-stream');
    x.setRequestHeader('Authorization', 'Bearer ' + me.token);
    x.upload.onprogress = e => e.lengthComputable && onp && onp(Math.round(e.loaded / e.total * 100));
    x.onload = () => {
      let d = {}; try { d = JSON.parse(x.responseText); } catch {}
      x.status < 300 ? res(d) : rej(new Error(d.error || 'Не удалось загрузить файл'));
    };
    x.onerror = () => rej(new Error('Нет соединения'));
    x.send(blob);
  });
}
async function uploadAvatar(file) {
  if (!file.type.startsWith('image/')) throw new Error('Выберите фото');
  const r = await prepImage(file, 320, .88, true);
  return (await upload(r.blob, 'avatar')).url;
}

/* ---------- Вход ---------- */
let reg = true;
function authUI() {
  $('#fN').hidden = $('#fH').hidden = !reg;
  $('#el').textContent = reg ? 'Email' : 'Email или @юзернейм';
  $('#authBtn').textContent = reg ? 'Создать аккаунт' : 'Войти';
  $('#tglT').textContent = reg ? 'Уже есть аккаунт?' : 'Нет аккаунта?';
  $('#tgl').textContent = reg ? 'Войти' : 'Регистрация';
  $('#aerr').textContent = '';
  $('#ap').autocomplete = reg ? 'new-password' : 'current-password';
}
$('#tgl').onclick = () => { reg = !reg; authUI(); };
$('#authForm').onsubmit = async e => {
  e.preventDefault();
  $('#aerr').textContent = '';
  try {
    const d = reg
      ? await api('/api/register', 'POST', {username: $('#an').value, handle: $('#ah').value, email: $('#ae').value, password: $('#ap').value})
      : await api('/api/login', 'POST', {email: $('#ae').value, password: $('#ap').value});
    me = {...d.user, token: d.token}; save(); boot();
  } catch (x) { $('#aerr').textContent = x.message; }
};

function boot() {
  $('#auth').hidden = true;
  $('#app').hidden = false;
  paintMe(); setMars(me.mars || 0); renderList(); connect();
}
const paintMe = () => { $('#meBtn').innerHTML = uav(me, 'xs') + '<span>Профиль</span>'; };

function logout(msg) {
  if (me && me.token) fetch('/api/logout', {method: 'POST', headers: {Authorization: 'Bearer ' + me.token}}).catch(() => {});
  localStorage.removeItem('ovk_user');
  me = null; cur = null; query = ''; found = []; pend = null; opened = false;
  if (ws) { ws.onclose = null; ws.close(); }
  chats = new Map(); msgs = new Map(); catalog = new Map(); foundCh = [];
  closeModal();
  $('#q').value = '';
  $('#app').hidden = true; $('#app').classList.remove('open');
  $('#room').hidden = true; $('#empty').hidden = false;
  $('#auth').hidden = false;
  authUI();
  if (typeof msg === 'string') $('#aerr').textContent = msg;
}

// Проверяем, что аккаунт ещё есть на сервере. Сеть недоступна — остаёмся в аккаунте и ждём
async function checkSession() {
  try {
    me = {...me, ...await api('/api/profile/' + me.id)};
    save(); paintMe();
  } catch (e) {
    if (!me) return false; // api() уже вышел из аккаунта (сессия устарела)
    if (/найден/.test(e.message)) {
      logout('Сервер не нашёл ваш аккаунт: данные на сервере были сброшены. Зарегистрируйтесь или войдите снова.');
      return false;
    }
  }
  return true;
}

/* ---------- Соединение ---------- */
const getMsgs = id => api(`/api/messages/${encodeURIComponent(id)}?userId=${me.id}`);

function connect() {
  if (!me) return;
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = async () => {
    if (!await checkSession()) return;
    ws.send(JSON.stringify({type: 'connect', token: me.token, active: !document.hidden}));
    $('#conn').hidden = true;
    loadCatalog();
    await loadChats();
    if (opened) { // после обрыва подтягиваем пропущенное
      msgs.forEach((_, k) => { if (k !== cur) msgs.delete(k); });
      if (cur) try { msgs.set(cur, await getMsgs(cur)); renderMsgs(); markRead(); } catch {}
    }
    opened = true;
  };
  ws.onmessage = e => onWs(JSON.parse(e.data));
  ws.onclose = () => { $('#conn').hidden = false; if (me) setTimeout(connect, 2000); };
}
// Сообщаем серверу, видна ли вкладка: пока видна, идёт время для Mars
function sendActive() { if (ws && ws.readyState === 1) ws.send(JSON.stringify({type: 'active', active: !document.hidden})); }
function onVisible() {
  sendActive();
  if (document.hidden || !me) return;
  if (cur) { markRead(); renderList(); }
  if (!ws || ws.readyState > 1) connect();
}
document.addEventListener('visibilitychange', onVisible);
window.addEventListener('focus', onVisible);

async function loadChats() {
  try {
    chats = new Map((await api('/api/chats/' + me.id)).map(c => [c.id, c]));
    if (cur && chats.has(cur)) markRead();
    renderList(); renderHead();
  } catch {}
}

// Сообщаем серверу, что открытый чат прочитан
function markRead() {
  const c = chats.get(cur);
  if (!c || document.hidden || !ws || ws.readyState !== 1) return;
  c.unread = 0;
  ws.send(JSON.stringify({type: 'read', chatId: cur}));
}

async function onWs(m) {
  const d = m.data;
  if (m.type === 'message') {
    let c = chats.get(d.chatId);
    if (!c) { await loadChats(); c = chats.get(d.chatId); if (!c) return; }
    c.last = d;
    const mine = d.senderId === me.id;
    const l = msgs.get(d.chatId);
    if (l && !l.some(x => x.id === d.id)) { l.push(d); if (cur === d.chatId) appendMsg(c, l, mine); }
    if (!mine) {
      clearTimeout(typing.get(d.chatId)); typing.delete(d.chatId);
      if (cur === d.chatId && !document.hidden) markRead(); else c.unread = (c.unread || 0) + 1;
    }
    renderList(); if (cur === d.chatId) renderHead();
  } else if (m.type === 'read') {
    const c = chats.get(d.chatId);
    if (!c) return;
    (c.reads = c.reads || {})[d.userId] = d.at;
    if (d.userId === me.id) c.unread = 0; // прочитано на другом устройстве
    if (cur === d.chatId) updateTicks();
    renderList();
  } else if (m.type === 'presence') {
    chats.forEach(c => {
      if (c.peer && c.peer.id === d.userId) c.peer.online = d.online;
      if (c.members) c.members.forEach(u => { if (u.id === d.userId) u.online = d.online; });
    });
    renderList(); renderHead();
  } else if (m.type === 'typing') {
    clearTimeout(typing.get(d.chatId));
    typing.set(d.chatId, setTimeout(() => { typing.delete(d.chatId); if (cur === d.chatId) renderHead(); }, 3000));
    if (cur === d.chatId) renderHead();
  } else if (m.type === 'chat') {
    loadChats();
  } else if (m.type === 'wallet') {
    setMars(d.mars);
  } else if (m.type === 'gift') {
    toast('🎁 Вам подарили подарок!');
  } else if (m.type === 'auth') {
    logout('Сессия устарела, войдите снова.');
  }
}

/* ---------- Прочитано ---------- */
const others = c => c.type === 'direct' ? (c.peer ? [c.peer.id] : []) : c.members.filter(u => u.id !== me.id).map(u => u.id);
// В группе сообщение считается прочитанным, когда его увидел хотя бы один участник
const isRead = (c, ts) => others(c).some(id => ((c.reads || {})[id] || '') >= ts);
const tick = (c, ts) => { if (c.type === 'channel') return ''; const r = isRead(c, ts); return `<span class="tk ${r ? 'rd' : ''}" data-t="${ts}">${r ? '✓✓' : '✓'}</span>`; };
function updateTicks() {
  const c = chats.get(cur);
  if (!c) return;
  msgsEl.querySelectorAll('.tk').forEach(el => {
    const r = isRead(c, el.dataset.t);
    el.textContent = r ? '✓✓' : '✓';
    el.classList.toggle('rd', r);
  });
}

/* ---------- Список чатов и поиск ---------- */
const mlabel = m => m.gift ? '🎁 Подарок' : m.media ? (m.media.kind === 'video' ? '🎥 Видео' : '📷 Фото') : '';
function preview(c) {
  const l = c.last;
  if (!l) return c.type === 'group' ? c.members.length + ' участн.' : c.type === 'channel' ? subs(c.subscribers) : 'Нет сообщений';
  let who = '';
  if (c.type === 'channel') who = '';
  else if (l.senderId === me.id) who = 'Вы: ';
  else if (c.type === 'group') { const u = c.members.find(x => x.id === l.senderId); who = (u ? u.username : '?') + ': '; }
  return who + [mlabel(l), l.text].filter(Boolean).join(' ');
}
function renderList() {
  const q = query.toLowerCase().replace(/^@/, '');
  const ts = c => c.last ? +new Date(c.last.timestamp) : (c.id === cur ? Infinity : c.type !== 'direct' ? +new Date(c.createdAt || 0) : 0);
  let a = [...chats.values()].filter(c => c.last || c.id === cur || c.type !== 'direct').sort((x, y) => ts(y) - ts(x));
  if (q) a = a.filter(c => title(c).toLowerCase().includes(q) || (c.peer && c.peer.handle.includes(q)) || (c.handle && c.handle.includes(q)));
  const have = new Set(a.filter(c => c.peer).map(c => c.peer.id));
  const people = q ? found.filter(u => !have.has(u.id)) : [];
  const chans = q ? foundCh.filter(c => !chats.has(c.id)) : [];
  const chansHtml = chans.length ? '<div class="sec">Каналы</div>' + chans.map(c =>
    `<div class="it" data-ch="${esc(c.id)}">${av(c.name, c.id, '', false, c.avatar)}<div class="im">${nmH('📢 ' + c.name, false)}<div class="lm"><span>${subs(c.subscribers)}${c.handle ? ' · @' + esc(c.handle) : ''}</span></div></div></div>`).join('') : '';

  const chatsHtml = a.map(c => {
    const n = c.unread || 0;
    const t = c.last ? (c.last.senderId === me.id ? tick(c, c.last.timestamp) : '') + lt(c.last.timestamp) : '';
    return `<div class="it ${c.id === cur ? 'on' : ''}" data-c="${esc(c.id)}">${cav(c)}
<div class="im"><div class="r1">${titleH(c)}<span class="tm">${t}</span></div>
<div class="lm"><span>${esc(preview(c))}</span>${n ? `<span class="bd">${n}</span>` : ''}</div></div></div>`;
  }).join('');
  const peopleHtml = people.length ? '<div class="sec">Люди</div>' + people.map(u =>
    `<div class="it" data-u="${u.id}">${uav(u, '', true)}<div class="im">${nmH(u.username, u.verified)}<div class="lm"><span>@${esc(u.handle)}</span></div></div></div>`).join('') : '';

  $('#list').innerHTML = chatsHtml + chansHtml + peopleHtml ||
    `<div class="sec">${q ? 'Ничего не найдено' : 'Чатов пока нет. Найдите человека или канал через поиск.'}</div>`;
}
$('#list').onclick = e => {
  const it = e.target.closest('.it');
  if (!it) return;
  if (it.dataset.c) openChat(it.dataset.c);
  else if (it.dataset.ch) channelPreview(foundCh.find(c => c.id === it.dataset.ch));
  else openUser(+it.dataset.u);
};
let st;
$('#q').oninput = e => {
  query = e.target.value.trim();
  renderList(); // меняется только список, поле поиска остаётся на месте — клавиатура не закрывается
  clearTimeout(st);
  const q = query.replace(/^@/, '');
  if (!q) { found = []; foundCh = []; return; }
  st = setTimeout(async () => {
    try {
      const [u, ch] = await Promise.all([
        api(`/api/users/search?q=${encodeURIComponent(q)}`),
        api(`/api/channels/search?q=${encodeURIComponent(q)}`)
      ]);
      if (query === e.target.value.trim()) { found = u; foundCh = ch; renderList(); }
    } catch {}
  }, 250);
};

/* ---------- Открытый чат ---------- */
async function openChat(id) {
  cur = id; pend = null; drawPend();
  const c = chats.get(id);
  if (c) c.unread = 0;
  $('#app').classList.add('open');
  $('#empty').hidden = true; $('#room').hidden = false;
  renderHead(); renderList();
  if (!msgs.has(id)) {
    msgsEl.innerHTML = '';
    try { msgs.set(id, await getMsgs(id)); } catch { msgs.set(id, []); }
  }
  if (cur === id) {
    renderMsgs(); markRead(); renderList();
    if (matchMedia('(pointer:fine)').matches) $('#inp').focus();
  }
}
async function openUser(uid) {
  try {
    const c = await api('/api/chats', 'POST', {userId: me.id, peerId: uid});
    if (!chats.has(c.id)) chats.set(c.id, c);
    closeModal();
    $('#q').value = ''; query = ''; found = []; foundCh = [];
    openChat(c.id);
  } catch (x) { alert(x.message); }
}
$('#back').onclick = () => { cur = null; pend = null; $('#app').classList.remove('open'); $('#room').hidden = true; $('#empty').hidden = false; renderList(); };

function renderHead() {
  const c = chats.get(cur);
  if (!c) return;
  const t = typing.has(cur), on = c.peer && c.peer.online;
  const sub = t ? 'печатает…' : c.type === 'group' ? c.members.length + ' участн.' : c.type === 'channel' ? subs(c.subscribers) : (on ? 'в сети' : 'не в сети');
  const canWrite = c.type !== 'channel' || c.creator === me.id; // в канал пишет только автор
  $('#form').hidden = !canWrite; $('#rdonly').hidden = canWrite;
  $('#hd').innerHTML = cav(c, 's') +
    `<div class="im">${titleH(c)}<small class="${t || on ? 'ty' : ''}">${sub}</small></div>`;
}
$('#hd').onclick = e => {
  const c = chats.get(cur);
  if (!c) return;
  if (c.type === 'group') groupInfo(c.id); else if (c.type === 'channel') channelInfo(c.id); else if (c.peer) userProfile(c.peer);
};

// Удаление чата по долгому нажатию на шапку
let hdLongPress;
$('#hd').onmousedown = () => {
  hdLongPress = setTimeout(() => {
    if (confirm('Удалить чат?')) deleteChat(cur);
  }, 800);
};
$('#hd').onmouseup = $('#hd').onmouseleave = () => clearTimeout(hdLongPress);

/* ---------- Сообщения ---------- */
let stick = true;
const toBottom = () => { msgsEl.scrollTop = msgsEl.scrollHeight; stick = true; };
msgsEl.onscroll = () => { stick = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 120; };
// Когда догружается фото/видео, остаёмся внизу, если были внизу
['load', 'loadedmetadata'].forEach(ev => msgsEl.addEventListener(ev, () => { if (stick) msgsEl.scrollTop = msgsEl.scrollHeight; }, true));

const mediaHtml = md => {
  const ar = md.w && md.h ? `aspect-ratio:${md.w}/${md.h};` : '';
  return md.kind === 'video'
    ? `<video src="${esc(md.url)}" controls playsinline preload="metadata" style="${ar}"></video>`
    : `<img class="ph" src="${esc(md.url)}" alt="Фото" loading="lazy" style="${ar}">`;
};
function msgHtml(c, l, i) {
  const m = l[i], prev = l[i - 1], mine = m.senderId === me.id;
  let h = '';
  if (!prev || new Date(prev.timestamp).toDateString() !== new Date(m.timestamp).toDateString())
    h += `<div class="day">${dl(m.timestamp)}</div>`;
  let who = '';
  if (c.type === 'group' && !mine && (!prev || prev.senderId !== m.senderId)) {
    const u = c.members.find(x => x.id === m.senderId);
    who = `<b>${esc(u ? u.username : '?')}${u && u.verified ? BADGE : ''}</b>`;
  }
  const ch = c.type === 'channel';
  return h + `<div class="m ${mine && !ch ? 'me' : ''} ${m.media || m.gift ? 'mm' : ''} ${ch ? 'ch' : ''}">${who}${m.gift ? giftBubble(m.gift, mine) : ''}${m.media ? mediaHtml(m.media) : ''}${m.text ? `<span class="tx">${esc(m.text)}</span>` : ''}<time>${hm(m.timestamp)}${mine && !ch ? tick(c, m.timestamp) : ''}</time></div>`;
}
function renderMsgs() {
  const c = chats.get(cur), l = msgs.get(cur) || [];
  if (!c) return;
  msgsEl.innerHTML = l.length ? l.map((_, i) => msgHtml(c, l, i)).join('') : '<div class="day" id="nomsg">Напишите первое сообщение</div>';
  toBottom();
}
// Новое сообщение добавляется в конец, остальное не перерисовывается (видео не прерывается)
function appendMsg(c, l, mine) {
  $('#nomsg')?.remove();
  msgsEl.insertAdjacentHTML('beforeend', msgHtml(c, l, l.length - 1));
  if (mine || stick) toBottom();
}
msgsEl.onclick = e => {
  const i = e.target.closest('img.ph');
  if (i) { $('#lbi').src = i.src; $('#lb').hidden = false; }
};
$('#lb').onclick = () => { $('#lb').hidden = true; $('#lbi').src = ''; };

// Контекстное меню для сообщений (долгое нажатие или правый клик)
msgsEl.oncontextmenu = async e => {
  const msg = e.target.closest('.m');
  if (!msg) return;
  e.preventDefault();
  
  // Найдем индекс сообщения
  const msgs = msgsEl.querySelectorAll('.m');
  const idx = [...msgs].indexOf(msg);
  if (idx === -1) return;
  
  const msgList = Array.from(msgs.get(cur) || []);
  const m = msgList[idx];
  if (!m) return;
  
  const mine = m.senderId === me.id;
  if (!mine) return; // Только свои сообщения можно редактировать/удалять
  
  const choice = confirm(`Выберите действие:\nОК = Редактировать\nОтмена = Удалить`);
  if (choice) {
    editMessage(m.id, m.text, cur);
  } else {
    deleteMessage(m.id, cur);
  }
};

const fit = () => { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 120) + 'px'; };
let tt = 0;
inp.oninput = () => {

$('#send').onpointerdown = e => e.preventDefault(); // кнопка не забирает фокус — клавиатура остаётся

function drawPend() {
  const el = $('#pend');
  if (!pend) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = (pend.kind === 'video'
    ? `<video class="th" src="${pend.local}#t=0.1" muted playsinline preload="metadata"></video>`
    : `<img class="th" src="${pend.local}" alt="">`) +
    '<div class="st"></div><button type="button" class="ib" id="px" aria-label="Убрать вложение">✕</button>';

function pendStatus() {
  const s = $('#pend .st');

}
$('#attach').onclick = async () => {
  const f = await pickFile('image/*,video/*');
  if (!f || !cur) return;
  const isV = f.type.startsWith('video/');
  if (!isV && !f.type.startsWith('image/')) return alert('Выберите фото или видео');
  if (isV && f.size > 50 * 1024 * 1024) return alert('Видео больше 50 МБ');

  const p = pend = {kind: isV ? 'video' : 'image', local: URL.createObjectURL(f), pct: 0, busy: true};
  drawPend();
  try {
    let blob = f, dims;
    if (isV) dims = await videoDims(p.local);
    else { const r = await prepImage(f, 1600, .85); blob = r.blob; dims = r; }
    const up = await upload(blob, 'media', pct => { p.pct = pct; if (pend === p) pendStatus(); });
    if (pend !== p) return; // вложение убрали
    Object.assign(p, {url: up.url, w: dims.w, h: dims.h, busy: false});
    pendStatus();
  } catch (x) {
    if (pend === p) { pend = null; drawPend(); }
    alert(x.message);
  }
};

$('#form').onsubmit = e => {
  e.preventDefault();
  const text = inp.value.trim();
  if ((!text && !pend) || !cur || (pend && pend.busy)) return;
  if (!ws || ws.readyState !== 1) { $('#conn').hidden = false; return; }
  const media = pend && {kind: pend.kind, url: pend.url, w: pend.w, h: pend.h};
  ws.send(JSON.stringify({type: 'message', chatId: cur, text, media}));
  pend = null; drawPend();
  inp.value = ''; fit(); inp.focus();
};

$('#modal').onclick = e => { if (e.target.id === 'modal' || e.target.closest('[data-x]')) closeModal(); };

// Выбор участников (для новой группы и для добавления в существующую)
function picker(box, exclude) {
  const sel = new Set();
  let t;
  box.innerHTML = `<div class="f"><label>Участники</label><input class="ps" placeholder="Поиск по имени или @юзернейму" autocomplete="off" autocapitalize="off"></div>
<div class="pc" style="color:var(--t2);font-size:13px;min-height:18px"></div><div class="pl" style="max-height:220px;overflow:auto"></div>`;
  const input = box.querySelector('.ps'), cnt = box.querySelector('.pc'), list = box.querySelector('.pl');
  const find = async () => {
    try {
      const r = (await api(`/api/users/search?q=${encodeURIComponent(input.value.replace(/^@/, ''))}&userId=${me.id}`)).filter(u => !exclude.has(u.id));
      list.innerHTML = r.map(u => `<label class="it" style="padding:6px 0"><input type="checkbox" data-u="${u.id}" ${sel.has(u.id) ? 'checked' : ''}>${uav(u, 's')}<div class="im">${nmH(u.username, u.verified)}<div class="lm"><span>@${esc(u.handle)}</span></div></div></label>`).join('')
        || '<div class="sec" style="padding-left:0">Никого не нашли</div>';
    } catch {}
  };
  input.oninput = () => { clearTimeout(t); t = setTimeout(find, 250); };
  list.onchange = e => {
    const id = +e.target.dataset.u;
    if (e.target.checked) sel.add(id); else sel.delete(id);
    cnt.textContent = sel.size ? 'Выбрано: ' + sel.size : '';
  };
  find();
  return sel;
}

  if (g.id === cur) g.unread = 0;
  chats.set(g.id, g);
  renderList(); renderHead();
}

  const c = chats.get(id);
  if (!c) return;
  modal(`<div style="text-align:center"><div id="gav">${cav(c, 'l')}</div>
<button class="lnk" id="gph">Сменить фото</button><button class="lnk" id="grm" ${c.avatar ? '' : 'hidden'}>Убрать</button></div>

<div style="max-height:220px;overflow:auto">${c.members.map(u =>
  `<div class="it" data-p="${u.id}" style="padding-left:0;padding-right:0">${uav(u, 's', true)}<div class="im">${nmH(u.username, u.verified, u.id === me.id ? ' (вы)' : '')}<div class="lm"><span>@${esc(u.handle)}</span></div></div></div>`).join('')}</div>
<div class="row"><button type="button" class="btn g" data-x>Закрыть</button></div>`);

  const patch = async body => {
    const g = await api('/api/groups/' + encodeURIComponent(id), 'PUT', {userId: me.id, ...body});

  };
  $('#gf').onsubmit = async e => {
    e.preventDefault();
    try { await patch({name: $('#gname').value}); closeModal(); } catch (x) { $('#ge').textContent = x.message; }
  };
  $('#gph').onclick = async () => {
    const f = await pickFile('image/*');
    if (!f) return;
    const b = $('#gph'); b.textContent = 'Загрузка…'; b.disabled = true;
    try { await patch({avatar: await uploadAvatar(f)}); } catch (x) { const e = $('#ge'); if (e) e.textContent = x.message; }
    if ($('#gph')) { b.textContent = 'Сменить фото'; b.disabled = false; }
  };

    const u = c.members.find(x => x.id == el.dataset.p);
    if (u && u.id !== me.id) userProfile(u);
  });

function addMembers(id) {
  const c = chats.get(id);
  if (!c) return;
  modal(`<h2 style="margin-bottom:12px">Добавить в «${esc(c.name)}»</h2><div id="pk"></div>
<div class="err" id="ge"></div>
<div class="row"><button class="btn" id="aok">Добавить</button><button type="button" class="btn g" id="aback">Назад</button></div>`);
  const sel = picker($('#pk'), new Set(c.members.map(u => u.id)));
  $('#aback').onclick = () => groupInfo(id);
  $('#aok').onclick = async () => {
    if (!sel.size) { $('#ge').textContent = 'Выберите хотя бы одного человека'; return; }
    try {
      putChat(await api(`/api/groups/${encodeURIComponent(id)}/members`, 'POST', {userId: me.id, members: [...sel]}));
      groupInfo(id);
    } catch (x) { $('#ge').textContent = x.message; }
  };
}

  modal(`<h2 style="margin-bottom:12px">Новая группа</h2>

const subs = n => n + ' ' + plural(n, ['подписчик', 'подписчика', 'подписчиков']);
let foundCh = [];

}

/* ---------- Mars и подарки ---------- */
let catalog = new Map(); // kind -> {emoji, name, price, supply, sold, bg}
const kindInfo = k => catalog.get(k) || {emoji: '🎁', name: 'Подарок', price: 0, supply: 0, sold: 0, bg: ['#c9ced6', '#9aa3b0']};
const gradient = k => `linear-gradient(150deg,${k.bg[0]},${k.bg[1]})`;

function setMars(n) {
  if (!me) return;
  me.mars = n; save();
  document.querySelectorAll('.mars-n').forEach(e => { e.textContent = n; });
}
let toastT;
function toast(t) {
  const el = $('#toast');
  el.textContent = t; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3000);
}
async function loadCatalog() {
  try {
    const d = await api('/api/shop');
    catalog = new Map(d.catalog.map(c => [c.kind, c]));
    setMars(d.mars);
    if (cur && msgs.has(cur)) renderMsgs(); // подарки в чате теперь рисуются с картинкой
  } catch {}
}

const giftCard = g => {
  const k = kindInfo(g.kind);
  return `<div class="gc" data-g="${esc(g.id)}" style="background:${gradient(k)}"><div class="gi">${k.emoji}</div><div class="gn">${esc(k.name)}</div><div class="gs">#${g.serial}</div></div>`;
};
// Подарок в переписке
const giftBubble = (g, mine) => {
  const k = kindInfo(g.kind);
  return `<div class="gb" style="background:${gradient(k)}"><div class="gt">🎁 ${mine ? 'Вы отправили подарок' : 'Подарок для вас'}</div><div class="gi">${k.emoji}</div><div class="gn">${esc(k.name)}</div><div class="gt">#${g.serial}${k.supply ? ' из ' + k.supply : ''}</div></div>`;
};

// Витрина подарков в профиле
async function loadGifts(uid, box, mine) {
  try {
    const l = await api('/api/gifts/' + uid);
    if (!document.body.contains(box)) return;
    box.innerHTML = l.length ? l.map(giftCard).join('') : '<div style="color:var(--t2);font-size:14px;grid-column:1/-1">Пока нет подарков</div>';
    box.onclick = e => {
      const el = e.target.closest('[data-g]');
      if (el) giftInfo(l.find(g => g.id === el.dataset.g), mine, () => (mine ? myProfile() : closeModal()));
    };
  } catch {}
}

function giftInfo(g, mine, back) {
  if (!g) return;
  const k = kindInfo(g.kind);
  modal(`<div class="gc big" style="background:${gradient(k)}"><div class="gi">${k.emoji}</div><div class="gn">${esc(k.name)}</div></div>
<div style="text-align:center;margin-top:12px;font-weight:600">№${g.serial}${k.supply ? ' из ' + k.supply : ''}</div>
<div style="text-align:center;color:var(--t2);font-size:13px;margin-top:4px">${g.from ? 'От ' + esc(g.from.username) + ' (@' + esc(g.from.handle) + ') · ' : ''}${new Date(g.at).toLocaleDateString('ru-RU')}</div>
<div class="err" id="ge"></div>
<div class="row">${mine ? '<button class="btn" id="gtr">Передать</button>' : ''}<button type="button" class="btn g" id="gbk">Назад</button></div>`);
  $('#gbk').onclick = back;
  if (mine) $('#gtr').onclick = () => pickUser('Кому передать подарок?', u => {
    if (!confirm(`Передать «${k.name} №${g.serial}» пользователю ${u.username}? Подарок уйдёт из вашего профиля.`)) return;
    api(`/api/gifts/${encodeURIComponent(g.id)}/transfer`, 'POST', {toId: u.id})
      .then(() => { toast('Подарок передан'); myProfile(); })
      .catch(x => alert(x.message));
  }, () => giftInfo(g, mine, back));
}

// Выбор одного человека
function pickUser(titleText, onPick, back) {
  modal(`<h2 style="margin-bottom:12px">${esc(titleText)}</h2>
<div class="f"><input id="pus" placeholder="Поиск по имени или @юзернейму" autocomplete="off" autocapitalize="off"></div>
<div id="pul" style="max-height:260px;overflow:auto"></div>
<div class="row"><button type="button" class="btn g" id="pbk">Назад</button></div>`);
  let t, res = [];
  const find = async () => {
    try {
      res = await api(`/api/users/search?q=${encodeURIComponent($('#pus').value.replace(/^@/, ''))}`);
      $('#pul').innerHTML = res.map(u => `<div class="it" data-p="${u.id}" style="padding-left:0">${uav(u, 's', true)}<div class="im">${nmH(u.username, u.verified)}<div class="lm"><span>@${esc(u.handle)}</span></div></div></div>`).join('')
        || '<div class="sec" style="padding-left:0">Никого не нашли</div>';
    } catch {}
  };
  $('#pus').oninput = () => { clearTimeout(t); t = setTimeout(find, 250); };
  $('#pul').onclick = e => { const el = e.target.closest('[data-p]'); if (el) onPick(res.find(u => u.id == el.dataset.p)); };
  $('#pbk').onclick = back || closeModal;
  find();
}

$('#wallet').onclick = () => shop();

// Магазин. to — кому дарим (если открыт из чужого профиля)
async function shop(to) {
  modal('<div class="sec" style="padding:0">Загрузка…</div>');
  let d;
  try { d = await api('/api/shop'); }
  catch (x) { modal(`<div class="err">${esc(x.message)}</div><div class="row"><button type="button" class="btn g" data-x>Закрыть</button></div>`); return; }
  catalog = new Map(d.catalog.map(c => [c.kind, c]));
  setMars(d.mars);
  modal(`<h2>🎁 Магазин подарков</h2>
<div style="margin:6px 0 4px;font-weight:600">👽 <span class="mars-n">${me.mars}</span> Mars</div>
<div style="color:var(--t2);font-size:13px;margin-bottom:10px">Mars начисляются за время в приложении: ${d.perMin} в минуту, пока вкладка открыта.</div>
${to ? `<div style="margin-bottom:10px;font-weight:600">Подарок для ${esc(to.username)}</div>` : ''}
<div class="gg">${d.catalog.map(c => {
    const left = c.supply - c.sold;
    return `<div class="gc ${left ? '' : 'off'}" data-k="${c.kind}" style="background:${gradient(c)}"><div class="gi">${c.emoji}</div><div class="gn">${esc(c.name)}</div><div class="gs">👽 ${c.price}</div><div class="gs">${left ? 'осталось ' + left : 'распродано'}</div></div>`;
  }).join('')}</div>
<div class="row"><button type="button" class="btn g" data-x>Закрыть</button></div>`);
  $('#card').querySelector('.gg').onclick = e => {
    const el = e.target.closest('[data-k]');
    if (el && !el.classList.contains('off')) giftBuy(el.dataset.k, to);
  };
}

function giftBuy(kind, to) {
  const k = kindInfo(kind);
  modal(`<div class="gc big" style="background:${gradient(k)}"><div class="gi">${k.emoji}</div><div class="gn">${esc(k.name)}</div></div>
<div style="text-align:center;margin-top:12px;font-weight:600">👽 ${k.price} Mars</div>
<div style="text-align:center;color:var(--t2);font-size:13px">Осталось ${k.supply - k.sold} из ${k.supply} · у вас 👽 <span class="mars-n">${me.mars}</span></div>
${to ? `<div class="f" style="margin-top:12px"><label>Сообщение для ${esc(to.username)} (необязательно)</label><input id="gmsg" maxlength="120"></div>` : ''}
<div class="err" id="ge"></div>
<div class="row">${to
    ? `<button class="btn" id="gb1">Подарить ${esc(to.username)} за 👽 ${k.price}</button>`
    : `<button class="btn" id="gb1">Купить себе за 👽 ${k.price}</button><button class="btn g" id="gb2">Подарить другу…</button>`}</div>
<div class="row"><button type="button" class="btn g" id="gbk">Назад</button></div>`);
  $('#gbk').onclick = () => shop(to);
  if (!to) $('#gb2').onclick = () => pickUser('Кому подарить?', u => giftBuy(kind, u), () => giftBuy(kind));
  $('#gb1').onclick = async () => {
    const b = $('#gb1'); b.disabled = true;
    try {
      const r = await api('/api/gifts/buy', 'POST', {kind, toId: to && to.id, message: to ? $('#gmsg').value : ''});
      setMars(r.mars);
      if (to) { toast(`🎁 Подарок отправлен: ${to.username}`); openUser(to.id); }
      else { toast(`Куплено: ${k.name} №${r.gift.serial}`); myProfile(); }
    } catch (x) { const e = $('#ge'); if (e) e.textContent = x.message; b.disabled = false; }
  };
}

/* ---------- Клавиатура на телефоне: подгоняем высоту под видимую область ---------- */
if (window.visualViewport) {
  const vv = visualViewport;
  const fitVV = () => {
    $('#app').style.height = vv.height + 'px';
    if (/INPUT|TEXTAREA/.test(document.activeElement?.tagName || '')) window.scrollTo(0, 0);
  };
  vv.addEventListener('resize', fitVV);
  vv.addEventListener('scroll', fitVV);
}

/* ---------- Запуск ---------- */
(async () => {
  authUI();
  try { me = JSON.parse(localStorage.getItem('ovk_user')); } catch { me = null; }
  if (me && await checkSession()) boot();
})();
</script>
